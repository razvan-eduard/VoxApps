name: Build Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'app/build.gradle.kts'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g. v0.1-beta, v0.1-rc1, v1.0)'
        required: true
        default: 'v0.1-beta'
      prerelease:
        description: 'Mark as prerelease?'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-licenses: true

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Symlink SDK for whisper build script
        run: |
          mkdir -p ~/Library/Android/sdk
          ln -sf /usr/local/lib/android/sdk/* ~/Library/Android/sdk/

      - name: Install SPIRV-Headers and Shaderc for whisper Vulkan build
        run: |
          # Install glslc (shaderc) from apt
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslc libshaderc-dev

          # Install SPIRV-Headers from source (apt package lacks CMake config files)
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/spirv-headers
          cd /tmp/spirv-headers
          cmake -B build -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --install build

          # Install Vulkan-Headers from source (for CMake config)
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/vulkan-headers
          cd /tmp/vulkan-headers
          cmake -B build -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --install build

          # Symlink glslc to /usr/local/bin (script expects brew --prefix → /usr/local)
          sudo ln -sf /usr/bin/glslc /usr/local/bin/glslc 2>/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Detect versionCode bump (skip build if unchanged)
        id: check_bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          PREV_CODE=$(git show HEAD~1:app/build.gradle.kts 2>/dev/null | grep 'versionCode' | grep -oE '[0-9]+' || echo "0")
          CURR_CODE=$(grep 'versionCode' app/build.gradle.kts | grep -oE '[0-9]+')
          echo "prev=$PREV_CODE curr=$CURR_CODE"
          if [ "$PREV_CODE" = "$CURR_CODE" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Skip build (versionCode not bumped)
        if: steps.check_bump.outputs.changed == 'false'
        run: echo "versionCode unchanged — skipping build"

      - name: Run unit tests
        if: steps.check_bump.outputs.changed != 'false'
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build release APK
        if: steps.check_bump.outputs.changed != 'false'
        run: ./gradlew assembleRelease --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version tag
        if: steps.check_bump.outputs.changed != 'false'
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
            IS_PRERELEASE="${{ github.event.inputs.prerelease }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # Auto-build from versionCode bump: read versionName from gradle
            VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
            VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | grep -oE '[0-9]+')
            TAG="v${VERSION_NAME}"
            if echo "$VERSION_NAME" | grep -qiE '-beta|-rc|-alpha'; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
            if echo "$TAG" | grep -qiE '-beta|-rc|-alpha'; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

      - name: Rename APK with tag
        if: steps.check_bump.outputs.changed != 'false'
        id: rename
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
             VoxCommander-${{ steps.version.outputs.tag }}.apk
          echo "apk_path=VoxCommander-${{ steps.version.outputs.tag }}.apk" >> $GITHUB_OUTPUT

      - name: Upload artifact
        if: steps.check_bump.outputs.changed != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: VoxCommander-${{ steps.version.outputs.tag }}
          path: VoxCommander-*.apk

      - name: Create GitHub Release
        if: steps.check_bump.outputs.changed != 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: VoxCommander-*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
