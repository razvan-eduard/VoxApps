name: Update README Release Links

# Keeps README.md's "Build Status" table (between the LATEST_RELEASES:START/END markers) pointing
# at whatever's actually published — tag, APK size, and download link — instead of hand-typed values
# that go stale the moment any app's version bumps or a new release lands.
#
# workflow_run, not release: published: every release-*.yml creates its GitHub Release with the
# default GITHUB_TOKEN (see their "Create release" steps) — and GitHub explicitly does not let an
# event triggered by GITHUB_TOKEN cascade into starting *another* workflow run (the same
# anti-recursion rule that also stops a token-triggered PR event from starting a workflow run). A
# plain `on: release: published` here would simply never fire. `workflow_run` is GitHub's
# documented workaround for chaining a follow-up workflow onto one you don't want to (or can't) edit
# to call it directly — it isn't subject to that restriction.
#
# concurrency + a pull --rebase before pushing: several apps' release workflows can each complete
# within moments of each other (e.g. after a shared version-bump commit lands on main), so more than
# one run of this workflow can be in flight at once — queued (not cancelled) so each run's push has a
# chance to land instead of racing on a stale base.

on:
  workflow_run:
    workflows:
      - Build Vox Calendar Release APK
      - Build Vox Expenses Release APK
      - Build Vox Notes Release APK
      - Build Commander Release APK
      - Build Vox Vision Release APK
      - Build Vox Hub Release APK
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-readme-releases
  cancel-in-progress: false

jobs:
  update-readme:
    # workflow_run fires on every completion, success or failure — a failed release build published
    # nothing new, so there's nothing to regenerate the table from.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          # main only accepts pushes from an actor the ruleset lets past, and GITHUB_TOKEN is not
          # one: on a personal account the GitHub Actions app cannot be named as a bypass actor at
          # all. README_PUSH_TOKEN is a fine-grained token owned by the repository admin, scoped to
          # contents:write on this repository and nothing else. Falling back to the default token
          # keeps a fork working — the push simply fails there, as it does for anyone without write
          # access, rather than the job erroring on a missing secret.
          token: ${{ secrets.README_PUSH_TOKEN || github.token }}
          persist-credentials: true

      - name: Regenerate Build Status table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/vox release readme

      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh latest-release links in README"
          git pull --rebase origin main
          git push origin HEAD:main
