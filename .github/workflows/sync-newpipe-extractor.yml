name: Sync NewPipeExtractor Version

# NewPipeExtractor (com.github.teamnewpipe:NewPipeExtractor, resolved via JitPack) is a plain binary
# dependency — no local patch, no native compile — exactly like sync-vosk.yml's Vosk. Dependabot's
# Gradle updater does not reliably track this JitPack-style coordinate (same reasoning as Vosk), which
# is why scripts/check_newpipe_extractor_version.sh exists as a manual, local-only check. This
# workflow runs the same check on a schedule and, if newer, bumps gradle/libs.versions.toml.
#
# Compiles and unit-tests the bump, then opens a PR for a person. It used to merge itself on green,
# and this dependency is the worst candidate in the repo for that: NewPipeExtractor breaks when
# YouTube changes its page structure, not when its API changes, so a green build cannot see the
# failure mode that actually happens. It says the API surface still resolves
# and compiles.

on:
  schedule:
    - cron: '0 6 * * 2' # weekly, Tuesday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

# A native build that hangs must not be lapped by the next run — both would push the same
# branch. Queued rather than cancelled: these push branches and open PRs, so killing one
# mid-flight leaves more mess than letting it finish.
concurrency:
  group: sync-newpipe-extractor
  cancel-in-progress: false

jobs:
  check-and-open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Persisted for the branch push, so it is pushed by whoever opens the PR below.
          token: ${{ secrets.README_PUSH_TOKEN || github.token }}
          submodules: recursive
          fetch-depth: 0

      # Detection lives in scripts/check_newpipe_extractor_version.sh — the same script a person runs, answering in
      # --report mode with the keys used below. This step used to be that script's logic
      # copied into YAML: four of the six pairs happened to agree, and the ones that did not
      # drifted silently (NewPipe's multi-line version, PaddleOCR's staleness floor).
      - name: Determine current pin and latest upstream version
        id: versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/vox check newpipe-extractor --report >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.versions.outputs.has_update == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        if: steps.versions.outputs.has_update == 'true'
        uses: android-actions/setup-android@v4
        with:
          accept-android-licenses: true

      - name: Bump version in libs.versions.toml
        if: steps.versions.outputs.has_update == 'true'
        id: bump
        run: |
          LATEST="${{ steps.versions.outputs.latest }}"
          BRANCH="chore/sync-newpipe-extractor-$LATEST"
          git checkout -b "$BRANCH"
          sed -i "s/^newpipeExtractor = \".*\"/newpipeExtractor = \"$LATEST\"/" gradle/libs.versions.toml
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Grant execute permission for gradlew
        if: steps.versions.outputs.has_update == 'true'
        run: chmod +x gradlew

      # -x autoCompileWhisper etc.: these preBuild-wired tasks are unrelated to what this workflow
      # is verifying (that vox-commander still compiles/passes tests against the new
      # NewPipeExtractor version). autoCompileWhisper in particular needs NDK/CMake/Vulkan setup
      # this workflow doesn't install (unlike release-commander.yml) — same exclusion
      # sync-openwakeword.yml already uses.
      - name: Compile + run unit tests
        if: steps.versions.outputs.has_update == 'true'
        run: |
          ./gradlew :vox-commander:compileDebugKotlin :vox-commander:testDebugUnitTest \
                    -PvoxSkipNativePrep \
                    --no-daemon

      - name: Commit and push
        if: steps.versions.outputs.has_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle/libs.versions.toml
          git commit -m "chore: bump NewPipeExtractor to ${{ steps.versions.outputs.latest }}"
          git push origin "${{ steps.bump.outputs.branch }}"

      - name: Open PR
        if: steps.versions.outputs.has_update == 'true'
        id: pr
        env:
          # A PAT, not GITHUB_TOKEN — see sync-whisper.yml's "Open PR" for why a PR opened with
          # GITHUB_TOKEN can never satisfy a required check.
          GH_TOKEN: ${{ secrets.README_PUSH_TOKEN || github.token }}
        run: |
          URL=$(gh pr create \
            --title "chore: bump NewPipeExtractor ${{ steps.versions.outputs.current }} -> ${{ steps.versions.outputs.latest }}" \
            --body "New NewPipeExtractor version detected on JitPack/GitHub (dependabot does not reliably track this coordinate — see scripts/check_newpipe_extractor_version.sh).

          Compiles and unit tests pass. That is a weaker claim than it looks for this dependency: NewPipeExtractor breaks when YouTube changes its page structure, which a compile cannot see. Worth a quick check of YouTube search/playback before merging." \
            --base main \
            --head "${{ steps.bump.outputs.branch }}")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

# Nothing merges itself here. The PR above is where this workflow stops.
