name: Sync Vosk Version

# Vosk (com.alphacephei:vosk-android, resolved via JitPack) is a plain binary dependency — no local
# patch, no native compile. Dependabot's Gradle updater does not reliably track this JitPack-style
# coordinate (confirmed empirically: it has never opened a PR for it, unlike proper Maven Central
# artifacts), which is why scripts/check_vosk_version.sh exists as a manual, local-only check. This
# workflow runs the same check on a schedule and, if newer, bumps gradle/libs.versions.toml.
#
# Compiles and unit-tests the bump, then opens a PR for a person. It used to merge itself on
# green; a green build here cannot speak to wake-word recognition at all — this
# is the one sync-*.yml that does, since Vosk itself carries no local patch and isn't compiled
# in-repo, the closest risk profile to a normal Dependabot bump. Accepted residual risk: a green
# build can't confirm wake-word model-loading/recognition accuracy is unaffected, only that Vosk's
# API surface still resolves and compiles — unlike Whisper/OpenWakeWord/ppocr-sdk/OpenCV, this one's
# judged an acceptable trade for staying current automatically.

on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

# A native build that hangs must not be lapped by the next run — both would push the same
# branch. Queued rather than cancelled: these push branches and open PRs, so killing one
# mid-flight leaves more mess than letting it finish.
concurrency:
  group: sync-vosk
  cancel-in-progress: false

jobs:
  check-and-open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Detection lives in scripts/check_vosk_version.sh — the same script a person runs, answering in
      # --report mode with the keys used below. This step used to be that script's logic
      # copied into YAML: four of the six pairs happened to agree, and the ones that did not
      # drifted silently (NewPipe's multi-line version, PaddleOCR's staleness floor).
      - name: Determine current pin and latest upstream version
        id: versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/vox check vosk --report >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.versions.outputs.has_update == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        if: steps.versions.outputs.has_update == 'true'
        uses: android-actions/setup-android@v3
        with:
          accept-android-licenses: true

      - name: Bump version in libs.versions.toml
        if: steps.versions.outputs.has_update == 'true'
        id: bump
        run: |
          LATEST="${{ steps.versions.outputs.latest }}"
          BRANCH="chore/sync-vosk-$LATEST"
          git checkout -b "$BRANCH"
          sed -i "s/^vosk = \".*\"/vosk = \"$LATEST\"/" gradle/libs.versions.toml
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Grant execute permission for gradlew
        if: steps.versions.outputs.has_update == 'true'
        run: chmod +x gradlew

      # -x autoCompileWhisper etc.: these preBuild-wired tasks are unrelated to what this workflow
      # is verifying (that vox-commander still compiles/passes tests against the new Vosk version).
      # autoCompileWhisper in particular needs NDK/CMake/Vulkan setup this workflow doesn't install
      # (unlike release-commander.yml) — same exclusion sync-openwakeword.yml already uses.
      - name: Compile + run unit tests
        if: steps.versions.outputs.has_update == 'true'
        run: |
          ./gradlew :vox-commander:compileDebugKotlin :vox-commander:testDebugUnitTest \
                    -PvoxSkipNativePrep \
                    --no-daemon

      - name: Commit and push
        if: steps.versions.outputs.has_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle/libs.versions.toml
          git commit -m "chore: bump Vosk to ${{ steps.versions.outputs.latest }}"
          git push origin "${{ steps.bump.outputs.branch }}"

      - name: Open PR
        if: steps.versions.outputs.has_update == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL=$(gh pr create \
            --title "chore: bump Vosk ${{ steps.versions.outputs.current }} -> ${{ steps.versions.outputs.latest }}" \
            --body "New Vosk Android version detected on JitPack (dependabot does not reliably track this coordinate — see scripts/check_vosk_version.sh).

          Compiles and unit tests pass. That is a weaker claim than it looks: no unit test loads a native model, so this says Vosk's API surface still resolves — not that wake-word model loading or recognition accuracy are unaffected. Worth a quick wake-word check before merging." \
            --base main \
            --head "${{ steps.bump.outputs.branch }}")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

# Nothing merges itself here. The PR above is where this workflow stops.
