name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  # onnxruntime-android is a native/ABI-sensitive dependency like the six already documented in
  # docs/BUILD_TIME_DEPENDENCIES.md (Whisper/OpenWakeWord/OpenCV/ppocr-sdk/Vosk/NewPipeExtractor) —
  # a green compileDebugKotlin/testDebugUnitTest only proves the Kotlin/Java API surface still
  # resolves, never that the actual .so still dlopen's correctly on a real device. That gap is
  # exactly how onnxruntime-android 1.27.0/1.28.0 (both shipping a broken arm64-v8a build) went
  # straight to main auto-merged: a fully green CI run the whole time, despite crashing OCR/
  # wake-word/TTS on every real device. This job skips the usual auto-merge for PRs touching that
  # dependency and asks for a manual on-device build+install instead. A real device/emulator CI
  # gate was attempted and abandoned — see docs/BUILD_TIME_DEPENDENCIES.md's onnxruntime-android
  # section for why: no combination of GitHub-hosted runner (macOS+HVF, ARM64 Linux+KVM, ARM64
  # Linux without acceleration, x86_64 Linux cross-arch, macOS same-arch software) could boot a
  # full Android system image within a practical CI timeout — every path hit a hard wall,
  # confirmed via live runs, not something fixable by tuning flags further. Every other dependency
  # keeps auto-merging exactly as before.
  detect:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      needs_manual_review: ${{ steps.check.outputs.needs_manual_review }}
    steps:
      - id: check
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          if [[ "$BRANCH" == *"onnxruntime"* ]]; then
            echo "needs_manual_review=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_manual_review=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Comment: manual on-device verification required"
        if: steps.check.outputs.needs_manual_review == 'true'
        run: |
          gh pr comment "$PR_URL" --body "⚠️ This bumps \`onnxruntime-android\`, a native/ABI-sensitive dependency — a past version (1.27.0/1.28.0) shipped a broken arm64-v8a build that crashed every OCR/wake-word/TTS engine at runtime despite compiling and passing unit tests cleanly. Auto-merge is skipped for this dependency; please build a release APK, install on a real device, and confirm OCR (vox-vision) and/or wake-word + TTS (vox-commander) actually work before merging manually."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  standard-check:
    needs: detect
    if: needs.detect.outputs.needs_manual_review != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-licenses: true

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Symlink SDK for whisper build script
        run: |
          mkdir -p ~/Library/Android/sdk
          ln -sf /usr/local/lib/android/sdk/* ~/Library/Android/sdk/

      - name: Install SPIRV-Headers and Shaderc for whisper Vulkan build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslc libshaderc-dev
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/spirv-headers
          cd /tmp/spirv-headers
          cmake -B build -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --install build
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/vulkan-headers
          cd /tmp/vulkan-headers
          cmake -B build -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --install build
          sudo ln -sf /usr/bin/glslc /usr/local/bin/glslc 2>/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        id: tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Compile debug (verify build, no APK)
        id: compile
        run: ./gradlew compileDebugKotlin assembleDebug --no-daemon

      - name: Squash merge PR to main
        if: success()
        run: |
          gh pr merge "$PR_URL" --squash --delete-branch
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on failure
        if: failure()
        run: |
          gh pr comment "$PR_URL" --body "❌ Tests or compilation failed on the PR branch. Auto-merge skipped. Please fix the issues before merging."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
