name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  standard-check:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-licenses: true

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Symlink SDK for whisper build script
        run: |
          mkdir -p ~/Library/Android/sdk
          ln -sf /usr/local/lib/android/sdk/* ~/Library/Android/sdk/

      - name: Install SPIRV-Headers and Shaderc for whisper Vulkan build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslc libshaderc-dev
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/spirv-headers
          cd /tmp/spirv-headers
          cmake -B build -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --install build
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/vulkan-headers
          cd /tmp/vulkan-headers
          cmake -B build -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --install build
          sudo ln -sf /usr/bin/glslc /usr/local/bin/glslc 2>/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        id: tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Compile debug (verify build, no APK)
        id: compile
        run: ./gradlew compileDebugKotlin assembleDebug --no-daemon

      - name: Squash merge PR to main
        if: success()
        run: |
          gh pr merge "$PR_URL" --squash --delete-branch
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on failure
        if: failure()
        run: |
          gh pr comment "$PR_URL" --body "❌ Tests or compilation failed on the PR branch. Auto-merge skipped. Please fix the issues before merging."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
