name: Deploy F-Droid Metadata

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Build Commander Release APK"
      - "Build Vox Notes Release APK"
      - "Build Vox Expenses Release APK"
      - "Build Vox Calendar Release APK"
      - "Build Vox Hub Release APK"
      - "Build Vox Vision Release APK"
    types:
      - completed

# Every run regenerates metadata for ALL apps and pushes to a separate repo (vox-fdroid-repo), so
# two of these racing (e.g. two release builds finishing minutes apart) means the second one's plain
# `git push` gets rejected as non-fast-forward. Since each run's output is idempotent, there's no
# need to let them race at all — serialize with a shared group so a later trigger queues behind an
# in-progress one instead of colliding with it. cancel-in-progress is left false (not true) so every
# trigger still gets to run once its turn comes, rather than a fast-arriving new run wiping out one
# still in flight.
concurrency:
  group: deploy-fdroid-metadata
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Only run if the triggering workflow succeeded OR if manually triggered
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Checkout VoxApps
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout vox-fdroid-repo
        uses: actions/checkout@v7
        with:
          repository: razvan-eduard/vox-fdroid-repo
          path: fdroid-repo
          token: ${{ secrets.FDROID_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Sync Metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Generate metadata locally in the VoxApps checkout
          ./scripts/vox release fdroid
          
          echo "Generated metadata structure:"
          ls -R metadata/
          
          # The generator only ever writes the *current* version's changelog, but F-Droid clients
          # show the history — every already-published <versionCode>.txt exists only in the
          # deployed tree and is regenerated by nobody. So the changelogs are carried across the
          # clean, oldest first, and the fresh tree is copied on top so everything else (icons,
          # descriptions, screenshots, deletions) still propagates as a true sync.
          KEEP=$(mktemp -d)
          if [ -d "fdroid-repo/metadata" ]; then
            (cd fdroid-repo/metadata && find . -path '*/changelogs/*.txt' -print0 \
              | while IFS= read -r -d '' f; do
                  mkdir -p "$KEEP/$(dirname "$f")"
                  cp "$f" "$KEEP/$f"
                done)
            rm -rf fdroid-repo/metadata/*
          fi
          mkdir -p fdroid-repo/metadata
          cp -R "$KEEP"/. fdroid-repo/metadata/ 2>/dev/null || true

          # Copy new metadata on top — the current version's changelog wins over a kept copy.
          if [ -d "metadata" ]; then
            cp -RT metadata/ fdroid-repo/metadata/
          fi
          
          cd fdroid-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add everything under metadata/ — new, modified and deleted files alike; `git add` on a
          # path stages removals of tracked files too. -f is needed for ignored paths.
          git add -f metadata/
          
          if git diff --staged --quiet; then
            echo "No metadata changes to commit."
          else
            git commit -m "Update metadata from VoxApps release (true sync)"
            git push
          fi
