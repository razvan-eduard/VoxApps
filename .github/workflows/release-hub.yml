name: Build Vox Hub Release APK

on:
  push:
    tags:
      - 'hub-v*'
    branches:
      - main
    paths:
      - 'vox-hub/build.gradle.kts'
  workflow_dispatch: {}

# One release at a time per app. Two pushes landing close together would both force-move the same
# tag and both delete the same release before recreating it — whichever finished second would win,
# and which one that was would depend on runner scheduling. Queued rather than cancelled: a publish
# interrupted half way leaves a tag pointing at a release that no longer exists.
concurrency:
  group: release-hub
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Shallow on purpose — see release-commander.yml for why depth 1. The version-bump
          # check no longer needs any git history (see "Detect versionCode bump" below); the
          # changelog step deepens on demand before it needs any either.
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-licenses: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine version tag
        id: version
        uses: ./.github/actions/compute-release-tag
        with:
          app-prefix: hub

      - name: Detect versionCode bump (skip build if this version was already released)
        id: check_bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Checks whether a GitHub Release already exists for this exact version, instead of
          # diffing versionCode against git's HEAD~1 — the old approach silently broke whenever
          # a push landed more than one commit at once (HEAD~1 then lands *inside* the same
          # push, already showing the bumped value, so prev==curr and the build gets skipped
          # even though this version has never been released).
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "$TAG already released — skipping build"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG not yet released — building"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run unit tests
        if: steps.check_bump.outputs.changed != 'false'
        run: ./gradlew :vox-hub:testDebugUnitTest --no-daemon

      - name: Decode signing keystore
        if: steps.check_bump.outputs.changed != 'false'
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK and AAB
        if: steps.check_bump.outputs.changed != 'false'
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew :vox-hub:assembleRelease --no-daemon
          ./gradlew :vox-hub:bundleRelease --no-daemon


      - name: Rename APK and AAB with tag
        if: steps.check_bump.outputs.changed != 'false'
        run: |
          cp vox-hub/build/outputs/apk/release/vox-hub-release.apk \
             VoxHub-${{ steps.version.outputs.tag }}.apk
          cp vox-hub/build/outputs/bundle/release/vox-hub-release.aab \
             VoxHub-${{ steps.version.outputs.tag }}.aab

      - name: Deepen checkout for changelog
        if: steps.check_bump.outputs.changed != 'false'
        run: git fetch --prune --unshallow --tags origin

      - name: Generate CHANGELOG.md
        if: steps.check_bump.outputs.changed != 'false'
        id: changelog
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PREV_TAG=$(git tag -l "hub-v*" --sort=-v:refname | grep -v "$TAG" | head -n 1 || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "# VoxHub ${TAG}"
            echo ""
            echo "## Changes"
            echo ""
            # Scoped to this app's own directory, and restricted to user-facing commit
            # types (feat/fix/perf) — otherwise the changelog lists every other app's
            # (and docs/chore/ci) commits too.
            git log ${RANGE} --pretty=format:"- %s (%h)" --no-merges -- vox-hub/ \
              | grep -iE '^- (feat|fix|perf)(\(|!?:)' || echo "- Maintenance update"
            echo ""
            echo ""
            echo "## Full Changelog"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
            else
              echo "https://github.com/${{ github.repository }}/commits/${TAG}"
            fi
          } > CHANGELOG.md

      # Publishing is for a push, not for a dispatch. `check_bump` only runs on a push to main, so
      # its output is empty on a manual run — and an empty value is not 'false', which meant every
      # "just build it and see" dispatch tagged the commit and cut a release at whatever version
      # happened to be current, walking straight around the guard that exists to prevent exactly
      # that. Building and testing still run: that is what a dispatch is for.
      - name: Point the tag at this commit
        if: steps.check_bump.outputs.changed != 'false' && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # Created through the API rather than `git push origin <tag>`. A tag push carries the whole
          # tree, so if any workflow file differs between this commit and the remote — which happens
          # whenever a CI change lands while a release is building — GitHub rejects the push with
          # "refusing to allow a GitHub App to create or update workflow ... without `workflows`
          # permission", and no `permissions:` block can grant GITHUB_TOKEN that. Moving a ref to an
          # existing commit carries no file content and is not subject to that rule.
          if gh api "repos/${{ github.repository }}/git/refs/tags/$TAG" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/$TAG" \
              -f sha="${{ github.sha }}" -F force=true >/dev/null
            echo "Moved $TAG to ${{ github.sha }}"
          else
            gh api -X POST "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="${{ github.sha }}" >/dev/null
            echo "Created $TAG at ${{ github.sha }}"
          fi

      - name: Delete existing release for a fresh publish date
        if: steps.check_bump.outputs.changed != 'false' && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release delete "$TAG" --yes || true

      - name: Create GitHub Release
        if: steps.check_bump.outputs.changed != 'false' && github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            VoxHub-*.apk
            VoxHub-*.aab
            CHANGELOG.md
          body_path: CHANGELOG.md
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
