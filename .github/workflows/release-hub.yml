name: Build Vox Hub Release APK

on:
  push:
    tags:
      - 'hub-v*'
    branches:
      - main
    paths:
      - 'vox-hub/build.gradle.kts'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-licenses: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Detect versionCode bump (skip build if unchanged)
        id: check_bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          PREV_CODE=$(git show HEAD~1:vox-hub/build.gradle.kts 2>/dev/null | grep 'versionCode' | grep -oE '[0-9]+' || echo "0")
          CURR_CODE=$(grep 'versionCode' vox-hub/build.gradle.kts | grep -oE '[0-9]+')
          echo "prev=$PREV_CODE curr=$CURR_CODE"
          if [ "$PREV_CODE" = "$CURR_CODE" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Run unit tests
        if: steps.check_bump.outputs.changed != 'false'
        run: ./gradlew :vox-hub:testDebugUnitTest --no-daemon

      - name: Decode signing keystore
        if: steps.check_bump.outputs.changed != 'false'
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        if: steps.check_bump.outputs.changed != 'false'
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: ./gradlew :vox-hub:assembleRelease --no-daemon

      - name: Determine version tag
        if: steps.check_bump.outputs.changed != 'false'
        id: version
        uses: ./.github/actions/compute-release-tag
        with:
          app-prefix: hub

      - name: Rename APK with tag
        if: steps.check_bump.outputs.changed != 'false'
        run: |
          cp vox-hub/build/outputs/apk/release/vox-hub-release.apk \
             VoxHub-${{ steps.version.outputs.tag }}.apk

      - name: Generate CHANGELOG.md
        if: steps.check_bump.outputs.changed != 'false'
        id: changelog
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PREV_TAG=$(git tag -l "hub-v*" --sort=-v:refname | grep -v "$TAG" | head -n 1 || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "# VoxHub ${TAG}"
            echo ""
            echo "## Changes"
            echo ""
            git log ${RANGE} --pretty=format:"- %s (%h)" --no-merges | grep -v "docs: update screenshots" | grep -v "fix: revert unnecessary versionCode" || echo "- Maintenance update"
            echo ""
            echo ""
            echo "## Full Changelog"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
            else
              echo "https://github.com/${{ github.repository }}/commits/${TAG}"
            fi
          } > CHANGELOG.md

      - name: Create GitHub Release
        if: steps.check_bump.outputs.changed != 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            VoxHub-*.apk
            CHANGELOG.md
          body_path: CHANGELOG.md
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
