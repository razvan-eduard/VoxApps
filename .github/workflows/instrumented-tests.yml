name: Instrumented Tests

# The only tests that can catch a native-linking regression run on a device, and until this
# workflow nothing ran them — the suite guarding against exactly the failure class that reached
# releases twice was never executed. Weekly rather than per-push: the native surface changes
# rarely, and CI already compiles these sources on every push, which is what catches ordinary
# drift.
#
# Ubuntu + KVM rather than a Mac: GitHub's hosted arm64 macOS runners cannot nest a VM (HVF
# reports HV_UNSUPPORTED), so an arm64 AVD never boots there. An x86_64 Android 11 google_apis
# image runs arm64-v8a libraries through the system image's ARM binary translation instead —
# which carries commander's whole native set, and is the only hosted-runner path that executes
# these libraries at all.
#
# Commander only. Translation has a fidelity ceiling: vision's OpenCV load crashes the translated
# process while passing on real arm64, so its connected test runs where real arm64 exists —
#     ANDROID_SERIAL=<arm64 avd> ./gradlew :vox-vision:connectedDebugAndroidTest
#
# NativeCrashReproductionTest is excluded: its *_crashReproduction tests bring the process down on
# purpose (they exist to prove tombstone patterns reproduce) and are run one at a time by hand.

on:
  schedule:
    - cron: '0 5 * * 3' # weekly, Wednesday 05:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: instrumented-tests
  cancel-in-progress: true

jobs:
  connected:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GRADLE_HEAP: -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The emulator is a VM; without KVM access it falls back to unaccelerated emulation and
      # times out before booting.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # -PvoxSkipNativePrep below skips both native engines, and whisper stays skipped (its
      # runtime is downloaded at test time anyway). The llama build is compiled here on purpose:
      # LlamaBridgeSmokeTest is what answers whether libllama.so executes under this emulator's
      # ARM binary translation, and it can only ask that with the library in the APK. The
      # library is a hybrid CPU+OpenCL build; its GPU inputs are repo-pinned submodules
      # (Khronos headers + ICD loader link stub), so no host GPU packages are installed here.
      # The script initializes the llama.cpp submodule itself on a bare checkout.
      # sdkmanager is not on the bare runner's PATH — the emulator action below manages its own
      # SDK, so this workflow never needed it before the llama build did. Same setup step the
      # sync workflows use.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-licenses: true

      - name: Install NDK and CMake for the llama build
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # From gradle/libs.versions.toml, so this cannot drift from what the scripts resolve.
          NDK_VERSION=$(grep -m1 '^ndk = ' gradle/libs.versions.toml | sed 's/.*"\(.*\)".*/\1/')
          sdkmanager --install "ndk;${NDK_VERSION}" "cmake;3.22.1"

      - name: Check out the OpenCL build inputs
        run: |
          # The OpenCL headers are a pinned submodule (the import library is an in-repo dlopen
          # shim); kernel
          # embedding needs only python3, which the runner already has.
          git submodule update --init vendor/OpenCL-Headers

      - name: Build libllama.so
        run: ./scripts/vox native llama

      - name: Run the instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          # One line: the action runs each script line as its own `sh -c`, so a continuation or
          # an `if` block would land as separate commands.
          script: ./gradlew :vox-commander:connectedDebugAndroidTest :core:apppicker:connectedDebugAndroidTest --no-daemon -PvoxSkipNativePrep "$GRADLE_HEAP" -Pandroid.testInstrumentationRunnerArguments.notClass=com.voxapps.commander.NativeCrashReproductionTest

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-results
          path: '**/build/reports/androidTests/**'
          retention-days: 14
          if-no-files-found: ignore
