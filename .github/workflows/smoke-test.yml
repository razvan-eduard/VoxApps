name: Smoke test a release APK

# Installs the exact APK a release run built and launches it on an arm64 emulator. This is the
# check no APK-content inspection can replace: R8 keep-rule breakage, install failures and
# first-launch crashes only exist at runtime. It runs after the release publishes, but before the
# release propagates — deploy-fdroid fires only on a fully green run, so a red smoke here keeps
# the release out of the F-Droid repo and flags the run for a person.

on:
  workflow_call:
    inputs:
      artifact:
        description: 'Name of the uploaded artifact holding the APK'
        required: true
        type: string
      application-id:
        description: 'Android applicationId to install, launch and watch'
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    # Ubuntu + KVM: GitHub's hosted arm64 macOS runners cannot nest a VM, so an arm64 AVD never
    # boots there. The x86_64 Android 11 google_apis image executes the arm64-v8a-only APK
    # through its ARM binary translation instead.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download the built APK
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact }}

      # The emulator is a VM; without KVM access it falls back to unaccelerated emulation and
      # times out before booting.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and watch for a crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            set -euo pipefail
            APK=$(ls ./*.apk | head -1)
            adb install "$APK"
            adb logcat -c || true
            adb shell monkey -p "${{ inputs.application-id }}" -c android.intent.category.LAUNCHER 1
            sleep 30
            # A crashed app has no process — liveness is the primary signal; the crash buffer is
            # the diagnosis when it is missing, and a belt for a crash the app survived visibly.
            if [ -z "$(adb shell pidof "${{ inputs.application-id }}" || true)" ]; then
              echo "::error::${{ inputs.application-id }} is no longer running 30s after launch"
              adb logcat -d -b crash | tail -40
              exit 1
            fi
            if adb logcat -d -b crash | grep -q "${{ inputs.application-id }}"; then
              echo "::error::crash recorded for ${{ inputs.application-id }} despite a live process"
              adb logcat -d -b crash | tail -40
              exit 1
            fi
            echo "${{ inputs.application-id }} is up 30s after a cold launch, no crashes recorded"
