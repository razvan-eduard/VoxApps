name: Sync PaddleOCR ppocr-sdk Fork

# vendor/ppocr-sdk vendors + locally patches PaddlePaddle/PaddleOCR's Android SDK (see
# vendor/ppocr-sdk/NOTICE). The byte-loading patch is maintained as a real, storable diff
# (vendor/ppocr-sdk/patches/0001-load-models-from-bytes.patch — regenerate with
# scripts/regen_ppocr_sdk_patch.sh whenever the patch itself changes).
#
# Unlike OpenWakeWord's small, focused fork, PaddleOCR is a ~2GB monorepo — we only need its
# deploy/ppocr-android/ppocr-sdk subdirectory, so vendor/paddleocr-upstream is a blobless, sparse
# submodule (see scripts/check_ppocr_sdk_version.sh for the same reasoning), and PaddleOCR has no
# release tags for this path — upstream is tracked by comparing commit SHAs on its default branch.
#
# When upstream's default branch moves, this workflow: bumps the pristine vendor/paddleocr-upstream
# submodule (re-fetched sparse + shallow at the new commit), re-vendors ALL of
# vendor/ppocr-sdk/src/main/java/com/paddle from it, and tries to `git apply` the stored patch.
#   - If it applies cleanly AND the module still compiles -> opens a PR that's already ready to
#     review/approve (the common case — nothing for a human to hand-merge).
#   - If the patch conflicts (upstream changed the exact patched lines) -> opens a PR with the
#     conflicting hunk attached, clearly marked as needing a manual merge.
#   - If it applies but something else broke -> opens a PR with the build failure attached.
# Never auto-merges — always a PR for review.

on:
  schedule:
    - cron: '0 6 * * 5' # weekly, Friday 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-propose a target that was previously declined'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

env:
  # How far behind upstream's tip this sync deliberately stays. See the "Determine current pin"
  # step for why a default-branch tip is not something to follow the same day.
  STALENESS_FLOOR_DAYS: 7

# A native build that hangs must not be lapped by the next run — both would push the same
# branch. Queued rather than cancelled: these push branches and open PRs, so killing one
# mid-flight leaves more mess than letting it finish.
concurrency:
  group: sync-ppocr-sdk
  cancel-in-progress: false

jobs:
  check-and-open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (without submodules — handled explicitly below)
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      # Detection lives in scripts/check_ppocr_sdk_version.sh — the same script a person runs, answering in
      # --report mode with the keys used below. This step used to be that script's logic
      # copied into YAML: four of the six pairs happened to agree, and the ones that did not
      # drifted silently (NewPipe's multi-line version, PaddleOCR's staleness floor).
      - name: Determine current pin and latest upstream version
        id: versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/vox check ppocr-sdk --report >> "$GITHUB_OUTPUT"

      - name: Check for an already-open PR for this target
        if: steps.versions.outputs.has_update == 'true'
        id: dedup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_SHA="${{ steps.versions.outputs.latest_sha }}"
          BRANCH="chore/sync-ppocr-sdk-${LATEST_SHA:0:9}"
          # --state all, not open: closing a sync PR without merging is a decision — "we are not
          # taking this upstream commit" — and it has to stick. Deduping on open PRs only meant a
          # closed one came straight back the following week, identical, so declining an update was
          # impossible and the PRs accumulated as permanent noise instead.
          #
          # A decision is not a life sentence: dispatching with force re-proposes a declined target,
          # which is how a target closed for a reason since fixed gets another run. Only a manual
          # dispatch can set it, so the weekly schedule still respects every past decline.
          EXISTING=$(gh pr list --head "$BRANCH" --state all --json number,state -q '.[0] | select(.) | "\(.number) \(.state)"' || true)
          if [ -n "$EXISTING" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "PR $EXISTING already exists for $BRANCH — re-proposing it (force)"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$EXISTING" ]; then
            echo "PR $EXISTING already exists for $BRANCH — nothing to do"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump submodule (sparse + shallow at the new commit) + re-vendor sources
        if: steps.versions.outputs.has_update == 'true' && steps.dedup.outputs.proceed == 'true'
        id: bump
        run: |
          LATEST_SHA="${{ steps.versions.outputs.latest_sha }}"
          LATEST_SHORT="${LATEST_SHA:0:9}"
          BRANCH="chore/sync-ppocr-sdk-$LATEST_SHORT"
          git checkout -b "$BRANCH"

          rm -rf vendor/paddleocr-upstream
          git clone --filter=blob:none --sparse --no-checkout \
            https://github.com/PaddlePaddle/PaddleOCR.git vendor/paddleocr-upstream
          cd vendor/paddleocr-upstream
          git sparse-checkout set deploy/ppocr-android/ppocr-sdk
          git fetch --depth 1 origin "$LATEST_SHA"
          git checkout "$LATEST_SHA"
          cd "$GITHUB_WORKSPACE"

          # Full re-vendor: mirror every upstream source file into vendor/ppocr-sdk/src/main/java.
          # For most files this is a pure refresh; the 4 patched files are overwritten with the
          # pristine upstream version here and patched in the next step. build.gradle.kts,
          # AndroidManifest.xml, proguard-rules.pro, and the dropped androidTest/ dir are VoxApps
          # build-config adaptations, not part of the upstream re-vendor — left untouched.
          rm -rf vendor/ppocr-sdk/src/main/java/com/paddle
          mkdir -p vendor/ppocr-sdk/src/main/java/com/paddle
          cp -r vendor/paddleocr-upstream/deploy/ppocr-android/ppocr-sdk/src/main/java/com/paddle/* \
                vendor/ppocr-sdk/src/main/java/com/paddle/

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # Every patch in the folder, in name order — the folder is the list. Naming one patch here
      # meant 0002 would have had to be remembered twice, and the way that failure shows up is a
      # re-vendor that silently drops an adaptation and reports thirteen compile errors with no
      # mention of the patch that was never applied.
      - name: Re-apply our patches
        if: steps.versions.outputs.has_update == 'true' && steps.dedup.outputs.proceed == 'true'
        id: apply
        run: |
          # Three-way, so an upstream release that moves lines near an adaptation merges instead of
          # refusing. A refusal here is silent damage: the re-vendored file stays pristine and the
          # adaptation is simply gone. A real collision arrives as conflict markers, which a person
          # can resolve in the PR.
          source scripts/lib/patches.sh
          STATUS="clean"
          for patch in vendor/ppocr-sdk/patches/*.patch; do
            echo "--- $patch"
            # The merge base for each hunk is the pristine upstream file the patch was cut against.
            PRISTINE=()
            while read -r rel; do
              PRISTINE+=("vendor/paddleocr-upstream/deploy/ppocr-android/ppocr-sdk/${rel#vendor/ppocr-sdk/}")
            done < <(git apply --numstat "$patch" | awk '{print $3}')

            case "$(vox_patch_apply_3way "$patch" "${PRISTINE[@]}")" in
              clean)    echo "    applied" ;;
              conflict) echo "    applied with conflicts in:"
                        vox_patch_conflicts | sed 's/^/      /'
                        # One conflict decides the whole step: a tree with markers in it is not
                        # something to hand to a build and describe as clean.
                        STATUS="conflict" ;;
              *)        echo "    could not be applied at all"
                        STATUS="conflict" ;;
            esac
          done
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      # A re-vendor is a wholesale copy of someone else's source tree, and the review it gets is a
      # human reading a diff of dozens of third-party files. Files upstream has *added* are what
      # that reading is least likely to catch and what an injection would use, so they are called
      # out by name rather than left to be noticed.
      - name: Guard — did upstream add or remove files?
        if: steps.versions.outputs.has_update == 'true' && steps.dedup.outputs.proceed == 'true'
        id: guard
        run: |
          ADDED=$(git status --porcelain vendor/ppocr-sdk/src/main/java/com/paddle \
                  | awk '/^\?\?/ {print "  + " $2}')
          REMOVED=$(git status --porcelain vendor/ppocr-sdk/src/main/java/com/paddle \
                  | awk '/^ ?D/ {print "  - " $2}')
          {
            echo "added<<EOF"; echo "$ADDED"; echo "EOF"
            echo "removed<<EOF"; echo "$REMOVED"; echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$ADDED" ] || [ -n "$REMOVED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Upstream changed the file set:"; echo "$ADDED"; echo "$REMOVED"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "File set unchanged — same files as the pinned version."
          fi

      - name: Set up JDK 17
        if: steps.versions.outputs.has_update == 'true' && steps.dedup.outputs.proceed == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        if: steps.versions.outputs.has_update == 'true' && steps.dedup.outputs.proceed == 'true'
        uses: android-actions/setup-android@v4
        with:
          accept-android-licenses: true

      - name: Install NDK and CMake (needed to build OpenCV, a compile-time dependency of ppocr-sdk)
        if: steps.versions.outputs.has_update == 'true' && steps.dedup.outputs.proceed == 'true'
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1"


      - name: Fetch vendor/opencv submodule (needed to build OpenCV before ppocr-sdk can compile)
        if: steps.versions.outputs.has_update == 'true' && steps.dedup.outputs.proceed == 'true'
        run: git submodule update --init vendor/opencv

      - name: Grant execute permission for gradlew
        if: steps.versions.outputs.has_update == 'true' && steps.dedup.outputs.proceed == 'true'
        run: chmod +x gradlew

      # Only run the build when the patch applied cleanly — a conflict already means "needs manual
      # merge", so there's nothing meaningful to compile yet. This runs autoCompileOpenCv for real
      # (ppocr-sdk's Kotlin source imports its generated org.opencv.* bindings, unlike OpenWakeWord's
      # self-contained module) — expect this step to take a few minutes.
      - name: Compile (only if the patch applied cleanly)
        if: steps.versions.outputs.has_update == 'true' && steps.dedup.outputs.proceed == 'true' && steps.apply.outputs.status == 'clean'
        id: build
        run: |
          if ./gradlew :vendor:ppocr-sdk:compileDebugKotlin :vox-vision:compileDebugKotlin \
                       --no-daemon > /tmp/build.log 2>&1; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
            tail -c 20000 /tmp/build.log
          fi

      - name: Commit re-vendor + submodule bump
        if: steps.versions.outputs.has_update == 'true' && steps.dedup.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vendor/paddleocr-upstream vendor/ppocr-sdk/src/main/java
          git commit -m "chore: sync PaddleOCR ppocr-sdk fork to ${{ steps.versions.outputs.latest_sha }}"
          git push origin "${{ steps.bump.outputs.branch }}"

      - name: Prepare PR body
        if: steps.versions.outputs.has_update == 'true' && steps.dedup.outputs.proceed == 'true'
        run: |
          APPLY_STATUS="${{ steps.apply.outputs.status }}"
          BUILD_STATUS="${{ steps.build.outputs.status }}"
          LATEST_SHORT="${{ steps.versions.outputs.latest_sha }}"
          LATEST_SHORT="${LATEST_SHORT:0:9}"
          CURRENT_SHORT="${{ steps.versions.outputs.current_sha }}"
          CURRENT_SHORT="${CURRENT_SHORT:0:9}"

          {
            echo "Upstream [PaddlePaddle/PaddleOCR](https://github.com/PaddlePaddle/PaddleOCR) (deploy/ppocr-android/ppocr-sdk) moved to \`$LATEST_SHORT\` (we were pinned at \`$CURRENT_SHORT\`)."
            echo ""
            echo "This is the newest upstream commit at least ${{ env.STALENESS_FLOOR_DAYS }} days old, not the tip — PaddleOCR has no release tags for this path, so the wait stands in for upstream deciding a commit is ready."
            echo ""
            if [ "${{ steps.guard.outputs.changed }}" == "true" ]; then
              echo "**📂 Upstream changed the file set.** Added files are the part of a re-vendor a diff review is least likely to catch — read these before the rest:"
              echo '```'
              echo "${{ steps.guard.outputs.added }}"
              echo "${{ steps.guard.outputs.removed }}"
              echo '```'
              echo ""
            fi
            if [ "$APPLY_STATUS" == "clean" ] && [ "$BUILD_STATUS" == "pass" ]; then
              echo "**✅ Patch applied automatically. Compiles.** All sources are re-vendored and the byte-loading patch (vendor/ppocr-sdk/patches/0001-load-models-from-bytes.patch) is already re-applied — nothing left to hand-merge. Please review the diff and approve."
            elif [ "$APPLY_STATUS" == "clean" ] && [ "$BUILD_STATUS" == "fail" ]; then
              echo "**⚠️ Patch applied textually, but the build failed** — something else in this release broke compatibility. Log tail:"
              echo '```'
              tail -c 8000 /tmp/build.log 2>/dev/null || echo "(log unavailable)"
              echo '```'
            else
              echo "**⚠️ Manual merge needed** — the byte-loading patch no longer applies cleanly (upstream changed the same lines in one of the 4 patched files). All other files are already re-vendored. Reject details:"
              echo '```'
              cat /tmp/apply-reject.txt 2>/dev/null || echo "(reject details unavailable)"
              echo '```'
              echo ""
              echo "After resolving, regenerate the patch file with \`./scripts/vox patches regen ppocr-sdk\`."
            fi
          } > /tmp/pr-body.md

      - name: Open PR
        if: steps.versions.outputs.has_update == 'true' && steps.dedup.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APPLY_STATUS="${{ steps.apply.outputs.status }}"
          BUILD_STATUS="${{ steps.build.outputs.status }}"
          LATEST_SHORT="${{ steps.versions.outputs.latest_sha }}"
          LATEST_SHORT="${LATEST_SHORT:0:9}"
          if [ "$APPLY_STATUS" == "clean" ] && [ "$BUILD_STATUS" == "pass" ]; then
            TITLE="chore: PaddleOCR ppocr-sdk $LATEST_SHORT — ready to review"
          elif [ "$APPLY_STATUS" == "clean" ]; then
            TITLE="chore: PaddleOCR ppocr-sdk $LATEST_SHORT — applied but build failed"
          else
            TITLE="chore: PaddleOCR ppocr-sdk $LATEST_SHORT — manual merge needed"
          fi

          gh pr create \
            --title "$TITLE" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "${{ steps.bump.outputs.branch }}"
