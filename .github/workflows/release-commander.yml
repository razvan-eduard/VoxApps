name: Build Commander Release APK

on:
  push:
    tags:
      - 'commander-v[0-9]*'
    branches:
      - main
    paths:
      - 'vox-commander/build.gradle.kts'
  # A dispatched run builds but does not publish, unless you tick this. Six accidental dispatches
  # once published six GitHub Releases, which is why publishing was blocked here at all — but a
  # blanket block also removes the only way to re-publish a release whose build succeeded and whose
  # publish step failed. An explicit opt-in keeps the accident impossible and the deliberate case
  # available.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release (move the tag, upload the APK). Off = build only.'
        type: boolean
        default: false
      dlc_mode:
        description: 'Override the DLC mode for this run (blank = whatever gradle.properties says).'
        type: choice
        options: ['', 'minimal', 'full']
        default: ''

# One release at a time per app. Two pushes landing close together would both force-move the same
# tag and both delete the same release before recreating it — whichever finished second would win,
# and which one that was would depend on runner scheduling. Queued rather than cancelled: a publish
# interrupted half way leaves a tag pointing at a release that no longer exists.
concurrency:
  group: release-commander
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Provenance is signed with a short-lived OIDC identity and recorded in GitHub's
      # transparency log; neither is possible without these two.
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No submodules here — Commander only needs whisper.cpp + openwakeword-android-kt
          # (checked out explicitly below), not the opencv/paddleocr/makeacopy submodules
          # vox-vision uses. `submodules:` on this action can't select a subset (only
          # true/false/recursive), so those 3 unrelated submodules — 565MB+ of OpenCV
          # upstream's own multi-year history alone — were being cloned on every Commander
          # release for zero benefit. Verified via an isolated worktree with those 3 left
          # uninitialized: full Gradle project configuration succeeds, and Commander's
          # release runtime classpath has no dependency edge into :vendor:ppocr-sdk or
          # :vendor:docquad-sdk (the modules that touch them).
          submodules: false
          # Shallow on purpose: full history (fetch-depth: 0) was pulling ~1.6GB of main-repo
          # history per run that the build never needs. The version-bump check below no longer
          # needs any git history either (it checks GitHub Releases directly, not HEAD~1), so
          # this can be the true minimum (1) — the changelog step further down deepens on demand
          # only when a release is actually being cut (see "Deepen checkout for changelog").
          fetch-depth: 1

      - name: Checkout whisper.cpp and openwakeword submodules
        run: |
          git submodule update --init --depth 1 \
            vox-commander/src/main/cpp/whisper.cpp \
            vendor/openwakeword-android-kt

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-licenses: true

      - name: Install NDK, CMake, and build-tools (for zipalign/apksigner)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1" "build-tools;36.0.0"


      - name: Install SPIRV-Headers and Shaderc for the whisper and llama Vulkan builds
        run: |
          # Install glslc (shaderc) from apt
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslc libshaderc-dev

          # Install SPIRV-Headers from source (apt package lacks CMake config files)
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/spirv-headers
          cd /tmp/spirv-headers
          cmake -B build -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --install build

          # Install Vulkan-Headers from source (for CMake config)
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/vulkan-headers
          cd /tmp/vulkan-headers
          cmake -B build -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --install build


      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine version tag
        id: version
        uses: ./.github/actions/compute-release-tag
        with:
          app-prefix: commander

      - name: Detect versionCode bump (skip build if this version was already released)
        id: check_bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Checks whether a GitHub Release already exists for this exact version, instead of
          # diffing versionCode against git's HEAD~1 — the old approach silently broke whenever
          # a push landed more than one commit at once (HEAD~1 then lands *inside* the same
          # push, already showing the bumped value, so prev==curr and the build gets skipped
          # even though this version has never been released).
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "$TAG already released — skipping build"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG not yet released — building"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip build (version already released)
        if: steps.check_bump.outputs.changed == 'false'
        run: echo "${{ steps.version.outputs.tag }} already released — skipping build"

      - name: Run unit tests
        if: steps.check_bump.outputs.changed != 'false'
        run: ./gradlew :vox-commander:testDebugUnitTest --no-daemon

      - name: Decode signing keystore
        if: steps.check_bump.outputs.changed != 'false'
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      # The mode is declared once, in gradle.properties, and read here. It used to be declared here
      # too, because Gradle and a shell packaging script each needed it and a mismatch shipped an APK
      # missing libraries nothing would fetch. That script is gone — Gradle packages both modes now —
      # so the only thing this workflow still needs the mode for is deciding whether to attach the
      # .so release assets. Needing to know it is not a reason to declare it again.
      - name: Resolve DLC mode
        id: dlc
        run: |
          MODE="${{ github.event.inputs.dlc_mode }}"
          if [ -z "$MODE" ]; then
            MODE=$(grep -E '^voxDlc=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          fi
          case "$MODE" in
            minimal|full) ;;
            *) echo "::error::voxDlc must be 'minimal' or 'full', got '$MODE'"; exit 1 ;;
          esac
          echo "Building in '$MODE' mode"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      # Signed by Gradle, and packaged by AGP. There is no post-build step: the DLC libs are excluded
      # at merge time (see vox-commander/build.gradle.kts's androidComponents block), which the APK
      # zip surgery this used to do could never achieve for the .aab — that shipped ~37MB of
      # libraries the APK did not have. In `full`, assembleRelease also stages the excluded libs for
      # upload via :vox-commander:collectDlcLibs.
      - name: Build and sign release APK and AAB
        if: steps.check_bump.outputs.changed != 'false'
        run: |
          ./gradlew :vox-commander:assembleRelease -PvoxDlc=${{ steps.dlc.outputs.mode }} --no-daemon
          ./gradlew :vox-commander:bundleRelease -PvoxDlc=${{ steps.dlc.outputs.mode }} --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}

      - name: Set APK and AAB path output
        if: steps.check_bump.outputs.changed != 'false'
        id: rename
        run: |
          cp vox-commander/build/outputs/apk/release/vox-commander-release.apk \
             VoxCommander-${{ steps.version.outputs.tag }}.apk
          echo "apk_path=VoxCommander-${{ steps.version.outputs.tag }}.apk" >> $GITHUB_OUTPUT
          cp vox-commander/build/outputs/bundle/release/vox-commander-release.aab \
             VoxCommander-${{ steps.version.outputs.tag }}.aab
          echo "aab_path=VoxCommander-${{ steps.version.outputs.tag }}.aab" >> $GITHUB_OUTPUT

      # A signed APK is the one thing this workflow cannot be wrong about: an unsigned or
      # wrongly-signed build installs over nothing and, for a signature-level IPC app, silently
      # breaks first-party routing. Gradle only signs when it sees the keystore env vars, so assert
      # rather than assume.
      - name: Verify the APK is signed
        if: steps.check_bump.outputs.changed != 'false'
        run: |
          # -L: on a runner the SDK path can be a tree of symlinks, and an unfollowed find
          # matches nothing (see scripts/lib/common.sh).
          BUILD_TOOLS="$(find -L "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs \
            "VoxCommander-${{ steps.version.outputs.tag }}.apk"

      # The digests the app verifies its downloads against ride inside the APK as generated
      # assets. Nothing else fails when the wiring that stages them is lost — build, suite and
      # release all stay green while every install downloads unverified — so the APK is opened
      # and checked here.
      - name: Verification assets are inside the APK
        if: steps.check_bump.outputs.changed != 'false'
        run: |
          set -euo pipefail
          APK="VoxCommander-${{ steps.version.outputs.tag }}.apk"
          LISTING=$(unzip -l "$APK")
          # A herestring, not `echo | grep -q`: -q closes the pipe at the first match, echo takes
          # SIGPIPE, and under pipefail a *found* asset is then reported as missing — racily, which
          # is worse than reliably.
          for asset in assets/whisper-libs.sha256 assets/whisper-libs.commit assets/llama-libs.sha256 assets/llama-libs.commit; do
            grep -qF "$asset" <<< "$LISTING" \
              || { echo "::error::$asset missing from $APK"; exit 1; }
          done
          if [ "${{ steps.dlc.outputs.mode }}" = "full" ]; then
            grep -qF "assets/dlc-libs.sha256" <<< "$LISTING" \
              || { echo "::error::assets/dlc-libs.sha256 missing from $APK"; exit 1; }
          fi

          # Present is not enough: the digests must describe the binaries the whisper-libs release
          # actually serves, or every install verifies a correct download against the wrong hashes
          # and Whisper cannot be enabled. whisper.cpp does not build reproducibly across toolchains,
          # so digests hashed from this runner's compile are guaranteed wrong — the build records the
          # release's own digests, and this proves that happened.
          PIN=$(git rev-parse "HEAD:vox-commander/src/main/cpp/whisper.cpp")
          TAG="whisper-libs-${PIN:0:12}"
          APK_DIGESTS=$(unzip -p "$APK" assets/whisper-libs.sha256 | sort)
          RELEASE_DIGESTS=$(gh release view "$TAG" --json assets \
            --jq '.assets[] | select(.name|endswith(".so")) | "\(.digest|sub("sha256:";""))  \(.name)"' | sort)
          if [ "$APK_DIGESTS" != "$RELEASE_DIGESTS" ]; then
            echo "::error::the APK's recorded whisper digests do not match what $TAG serves"
            echo "APK:";     echo "$APK_DIGESTS"
            echo "release:"; echo "$RELEASE_DIGESTS"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deepen checkout for changelog
        if: steps.check_bump.outputs.changed != 'false'
        run: git fetch --prune --unshallow --tags origin

      - name: Generate CHANGELOG.md
        if: steps.check_bump.outputs.changed != 'false'
        id: changelog
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # Find previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          # Generate changelog
          {
            echo "# VoxCommander ${TAG}"
            echo ""
            echo "## Changes"
            echo ""
            # Scoped to this app's own directory, and restricted to user-facing commit
            # types (feat/fix/perf) — otherwise the changelog lists every other app's
            # (and docs/chore/ci) commits too.
            git log ${RANGE} --pretty=format:"- %s (%h)" --no-merges -- vox-commander/ \
              | grep -iE '^- (feat|fix|perf)(\(|!?:)' || echo "- Maintenance update"
            echo ""
            echo ""
            echo "## Full Changelog"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
            else
              echo "https://github.com/${{ github.repository }}/commits/${TAG}"
            fi
          } > CHANGELOG.md
          cat CHANGELOG.md

      - name: Upload artifact
        if: steps.check_bump.outputs.changed != 'false'
        uses: actions/upload-artifact@v7
        with:
          name: VoxCommander-${{ steps.version.outputs.tag }}
          path: |
            VoxCommander-*.apk
            CHANGELOG.md

      # Publishing is for a push, not for a dispatch. `check_bump` only runs on a push to main, so
      # its output is empty on a manual run — and an empty value is not 'false', which meant every
      # "just build it and see" dispatch tagged the commit and cut a release at whatever version
      # happened to be current, walking straight around the guard that exists to prevent exactly
      # that. Building and testing still run: that is what a dispatch is for.
      # The one question no APK inspection can answer: does this build install and survive a
      # cold launch? Runs before anything publishes, so a red smoke means no release at all.
      # The x86_64 Android 11 image executes the arm64-v8a libraries through its ARM binary
      # translation — proof of link-and-launch; real hardware stays the ground truth. The
      # emulator is a VM, so KVM must be opened up first or it never boots.
      - name: Enable KVM
        if: steps.check_bump.outputs.changed != 'false'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on an emulator
        if: steps.check_bump.outputs.changed != 'false'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          # One line: the action runs each script line as its own `sh -c`, so logic lives in
          # scripts/smoke_launch_check.sh and this only names it.
          script: ./scripts/vox check smoke VoxCommander-*.apk com.voxapps.commander

      # A published tag is an address installed APKs still resolve — the DLC downloader builds its
      # URLs from the version it was compiled with. Moving such a tag to a different commit
      # replaces the assets behind every one of those addresses in place. Republishing the same
      # commit (a fresh publish date) is fine; anything else needs a version bump.
      - name: Refuse to move a published tag
        if: steps.check_bump.outputs.changed != 'false' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          # The peeled ref (^{}) sorts after the plain one, so tail -1 resolves an annotated tag
          # to its commit and leaves a lightweight tag as-is.
          REMOTE_SHA=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -1 | cut -f1)
          if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" != "$(git rev-parse HEAD)" ]; then
            if gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft \
                 --jq 'select(.isDraft == false)' 2>/dev/null | grep -q .; then
              echo "::error::$TAG is already published from $REMOTE_SHA — bump the version before releasing"
              exit 1
            fi
          fi

      - name: Point the tag at this commit
        if: steps.check_bump.outputs.changed != 'false' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # GITHUB_TOKEN can never hold the `workflows` scope, and what that forbids is making a ref
          # point at a tree whose .github/workflows content differs from the repository's own. It
          # bites when a workflow edit lands while a release is building: the tag then moves to a
          # commit whose workflow files are already stale. Going through the git/refs API was tried
          # and is subject to the same rule — it only trades an error naming the offending file for
          # a bare 403, so this is a push again. Tag the tip and nothing is stale.
          git tag -f "$TAG"
          git push origin "$TAG" --force

      - name: Delete existing release for a fresh publish date
        if: steps.check_bump.outputs.changed != 'false' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release delete "$TAG" --yes || true

      # What went into the APK: every resolved dependency, plus the vendored sources this app
      # compiles at build time, which appear in no Gradle configuration and would otherwise be
      # missing. Generated before the attestation so it is signed alongside the artifacts.
      - name: Generate SBOM
        if: steps.check_bump.outputs.changed != 'false'
        run: ./scripts/vox release sbom commander

      # The last thing between a built APK and a published one. A library that cannot resolve its
      # dependencies produces an APK that installs, runs, and fails the moment the feature using it
      # is touched — which is how a broken wake word reached two releases.
      # The Whisper libraries are not in the APK — AGP excludes them from every release build and the
      # app downloads them from the `whisper-libs` release. That release is published by hand, so the
      # pin can move without it, and then this APK is built against one whisper.cpp while every
      # install runs another. The SBOM published beside it names the pin, so the release would make a
      # provenance claim about a runtime it does not serve.
      #
      # A release predating the provenance marker reports `unknown` rather than failing, so this
      # gates on a definite mismatch only.
      - name: The published Whisper runtime matches this source
        if: steps.check_bump.outputs.changed != 'false'
        run: ./scripts/vox check whisper-published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Same gate for the llama runtime: excluded from every release build, downloaded from its
      # per-commit release, published by hand — so the pin can move without the runtime moving.
      - name: The published llama runtime matches this source
        if: steps.check_bump.outputs.changed != 'false'
        run: ./scripts/vox check llama-published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Native libraries satisfy each other
        if: steps.check_bump.outputs.changed != 'false'
        run: |
          set -euo pipefail
          # In `full` the DLC libraries are not in the APK — they are downloaded at first launch —
          # so they are added to the set being checked. Without them the APK looks as though its
          # JNI bridge has no runtime, which would make `full` checked less thoroughly than
          # `minimal`, exactly backwards.
          EXTRA=""
          if [ "${{ steps.dlc.outputs.mode }}" = "full" ]; then
            EXTRA="--with-libs vox-commander/build/dlc-libs"
          fi
          # shellcheck disable=SC2086
          ./scripts/vox check pairing VoxCommander-*.apk $EXTRA

      # Ties these exact bytes to this commit, this workflow and this runner, signed. A downloader
      # runs `gh attestation verify VoxCommander-<tag>.apk --repo ${{ github.repository }}` and learns
      # the APK came from this build — rather than trusting it because of where it was hosted. Same
      # guard as publishing: an artifact nobody can download needs no provenance.
      - name: Attest build provenance
        if: steps.check_bump.outputs.changed != 'false' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            VoxCommander-*.apk
            VoxCommander-*.aab
            VoxCommander-sbom.json

      - name: Create GitHub Release
        if: steps.check_bump.outputs.changed != 'false' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            VoxCommander-*.apk
            VoxCommander-*.aab
            VoxCommander-sbom.json
            CHANGELOG.md
            ${{ steps.dlc.outputs.mode == 'full' && 'vox-commander/build/dlc-libs/*.so' || '' }}
          body_path: CHANGELOG.md
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
