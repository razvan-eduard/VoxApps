name: Build Commander Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'vox-commander/build.gradle.kts'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-licenses: true

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Symlink SDK for whisper build script
        run: |
          mkdir -p ~/Library/Android/sdk
          ln -sf /usr/local/lib/android/sdk/* ~/Library/Android/sdk/

      - name: Install SPIRV-Headers and Shaderc for whisper Vulkan build
        run: |
          # Install glslc (shaderc) from apt
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslc libshaderc-dev

          # Install SPIRV-Headers from source (apt package lacks CMake config files)
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/spirv-headers
          cd /tmp/spirv-headers
          cmake -B build -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --install build

          # Install Vulkan-Headers from source (for CMake config)
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/vulkan-headers
          cd /tmp/vulkan-headers
          cmake -B build -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --install build

          # Symlink glslc to /usr/local/bin (script expects brew --prefix → /usr/local)
          sudo ln -sf /usr/bin/glslc /usr/local/bin/glslc 2>/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Detect versionCode bump (skip build if unchanged)
        id: check_bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          PREV_CODE=$(git show HEAD~1:vox-commander/build.gradle.kts 2>/dev/null | grep 'versionCode' | grep -oE '[0-9]+' || echo "0")
          CURR_CODE=$(grep 'versionCode' vox-commander/build.gradle.kts | grep -oE '[0-9]+')
          echo "prev=$PREV_CODE curr=$CURR_CODE"
          if [ "$PREV_CODE" = "$CURR_CODE" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Skip build (versionCode not bumped)
        if: steps.check_bump.outputs.changed == 'false'
        run: echo "versionCode unchanged — skipping build"

      - name: Run unit tests
        if: steps.check_bump.outputs.changed != 'false'
        run: ./gradlew :vox-commander:testDebugUnitTest --no-daemon

      - name: Decode signing keystore
        if: steps.check_bump.outputs.changed != 'false'
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        if: steps.check_bump.outputs.changed != 'false'
        run: ./gradlew :vox-commander:assembleRelease --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}

      - name: Determine version tag
        if: steps.check_bump.outputs.changed != 'false'
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # Auto-build from versionCode bump: read versionName from gradle
            VERSION_NAME=$(grep 'versionName' vox-commander/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
            TAG="v${VERSION_NAME}"
            if echo "$VERSION_NAME" | grep -qiE '-beta|-rc|-alpha'; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
            if echo "$TAG" | grep -qiE '-beta|-rc|-alpha'; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

      - name: Rename APK with tag
        if: steps.check_bump.outputs.changed != 'false'
        id: rename
        run: |
          cp vox-commander/build/outputs/apk/release/vox-commander-release.apk \
             VoxCommander-${{ steps.version.outputs.tag }}.apk
          echo "apk_path=VoxCommander-${{ steps.version.outputs.tag }}.apk" >> $GITHUB_OUTPUT

      - name: Collect native libraries for DLC
        if: steps.check_bump.outputs.changed != 'false'
        run: |
          # Copy essential libs to a staging folder for upload
          mkdir -p dlc-libs
          find vox-commander/build/intermediates/stripped_native_libs/release/stripReleaseDebugSymbols/out/lib/arm64-v8a -name "*.so" \
            -exec cp {} dlc-libs/ \;
          ls -R dlc-libs/

      - name: Generate CHANGELOG.md
        if: steps.check_bump.outputs.changed != 'false'
        id: changelog
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # Find previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          # Generate changelog
          {
            echo "# VoxCommander ${TAG}"
            echo ""
            echo "## Changes"
            echo ""
            git log ${RANGE} --pretty=format:"- %s (%h)" --no-merges
            echo ""
            echo ""
            echo "## Full Changelog"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
            else
              echo "https://github.com/${{ github.repository }}/commits/${TAG}"
            fi
          } > CHANGELOG.md
          cat CHANGELOG.md

      - name: Upload artifact
        if: steps.check_bump.outputs.changed != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: VoxCommander-${{ steps.version.outputs.tag }}
          path: |
            VoxCommander-*.apk
            CHANGELOG.md

      - name: Create GitHub Release
        if: steps.check_bump.outputs.changed != 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            VoxCommander-*.apk
            CHANGELOG.md
            dlc-libs/*.so
          body_path: CHANGELOG.md
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
