name: Build Commander Release APK

on:
  push:
    tags:
      - 'commander-v[0-9]*'
    branches:
      - main
    paths:
      - 'vox-commander/build.gradle.kts'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-licenses: true

      - name: Install NDK, CMake, and build-tools (for zipalign/apksigner)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1" "build-tools;36.0.0"

      - name: Symlink SDK for whisper build script
        run: |
          mkdir -p ~/Library/Android/sdk
          ln -sf /usr/local/lib/android/sdk/* ~/Library/Android/sdk/

      - name: Install SPIRV-Headers and Shaderc for whisper Vulkan build
        run: |
          # Install glslc (shaderc) from apt
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslc libshaderc-dev

          # Install SPIRV-Headers from source (apt package lacks CMake config files)
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/spirv-headers
          cd /tmp/spirv-headers
          cmake -B build -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --install build

          # Install Vulkan-Headers from source (for CMake config)
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/vulkan-headers
          cd /tmp/vulkan-headers
          cmake -B build -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --install build

          # Symlink glslc to /usr/local/bin (script expects brew --prefix → /usr/local)
          sudo ln -sf /usr/bin/glslc /usr/local/bin/glslc 2>/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Detect versionCode bump (skip build if unchanged)
        id: check_bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          PREV_CODE=$(git show HEAD~1:vox-commander/build.gradle.kts 2>/dev/null | grep 'versionCode' | grep -oE '[0-9]+' || echo "0")
          CURR_CODE=$(grep 'versionCode' vox-commander/build.gradle.kts | grep -oE '[0-9]+')
          echo "prev=$PREV_CODE curr=$CURR_CODE"
          if [ "$PREV_CODE" = "$CURR_CODE" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Skip build (versionCode not bumped)
        if: steps.check_bump.outputs.changed == 'false'
        run: echo "versionCode unchanged — skipping build"

      - name: Run unit tests
        if: steps.check_bump.outputs.changed != 'false'
        run: ./gradlew :vox-commander:testDebugUnitTest --no-daemon

      - name: Decode signing keystore
        if: steps.check_bump.outputs.changed != 'false'
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK (unsigned — signed after DLC stripping below)
        if: steps.check_bump.outputs.changed != 'false'
        run: ./gradlew :vox-commander:assembleRelease --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version tag
        if: steps.check_bump.outputs.changed != 'false'
        id: version
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # Auto-build from versionCode bump, or a manual workflow_dispatch run on main
            # (bypasses the check_bump gate above, e.g. to force-rebuild without a version
            # change) — both cases read versionName from gradle the same way.
            VERSION_NAME=$(grep 'versionName' vox-commander/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
            TAG="commander-v${VERSION_NAME}"
            if echo "$VERSION_NAME" | grep -qiE '-beta|-rc|-alpha'; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
            if echo "$TAG" | grep -qiE '-beta|-rc|-alpha'; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

      - name: Strip DLC libs and sign APK
        if: steps.check_bump.outputs.changed != 'false'
        run: |
          # AGP's packaging.jniLibs.excludes is unreliable on arm64-v8a for this dependency set
          # (see build.gradle.kts's release packaging comment / docs/BUILD_TIME_DEPENDENCIES.md), so
          # instead of asking AGP to exclude these at merge time, the APK is built fully bundled and
          # these libs are stripped directly from the built zip — a plain, deterministic file
          # operation that isn't subject to that bug.
          MERGED_LIBS_DIR="vox-commander/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib/arm64-v8a"

          # sherpa-onnx ships two alternate native entry points; only sherpa-onnx-jni.so is
          # actually used (confirmed via readelf: its only external NEEDED lib is libonnxruntime.so,
          # and the Java bindings' compiled classes reference "sherpa-onnx-jni" via loadLibrary — not
          # "-c-api" or "-cxx-api"). Those two are dead weight — stripped, never uploaded/downloaded.
          zip -d vox-commander/build/outputs/apk/release/vox-commander-release-unsigned.apk \
            "lib/arm64-v8a/libsherpa-onnx-c-api.so" \
            "lib/arm64-v8a/libsherpa-onnx-cxx-api.so"

          bash scripts/strip_dlc_libs.sh \
            vox-commander/build/outputs/apk/release/vox-commander-release-unsigned.apk \
            VoxCommander-${{ steps.version.outputs.tag }}.apk \
            "$RUNNER_TEMP/release.jks" \
            "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
            vox-commander \
            dlc-libs \
            "$MERGED_LIBS_DIR" \
            libonnxruntime.so libllm_inference_engine_jni.so libvosk.so libsherpa-onnx-jni.so
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Set APK path output
        if: steps.check_bump.outputs.changed != 'false'
        id: rename
        run: echo "apk_path=VoxCommander-${{ steps.version.outputs.tag }}.apk" >> $GITHUB_OUTPUT

      - name: Generate CHANGELOG.md
        if: steps.check_bump.outputs.changed != 'false'
        id: changelog
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # Find previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          # Generate changelog
          {
            echo "# VoxCommander ${TAG}"
            echo ""
            echo "## Changes"
            echo ""
            git log ${RANGE} --pretty=format:"- %s (%h)" --no-merges
            echo ""
            echo ""
            echo "## Full Changelog"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
            else
              echo "https://github.com/${{ github.repository }}/commits/${TAG}"
            fi
          } > CHANGELOG.md
          cat CHANGELOG.md

      - name: Upload artifact
        if: steps.check_bump.outputs.changed != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: VoxCommander-${{ steps.version.outputs.tag }}
          path: |
            VoxCommander-*.apk
            CHANGELOG.md

      - name: Create GitHub Release
        if: steps.check_bump.outputs.changed != 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            VoxCommander-*.apk
            CHANGELOG.md
            dlc-libs/*.so
          body_path: CHANGELOG.md
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
