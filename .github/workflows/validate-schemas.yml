# The same check the schemas repository runs, here where the files are edited first.
#
# The apps assert these rules in Kotlin against the copies they ship with, but only for the schema a
# build happens to include. This runs on the folder itself, so an edit is checked whether or not it
# reaches a build — and it is the same script the schemas repository mirrors, so the rules cannot
# drift between the two.
name: Validate schemas

on:
  push:
    paths: &schema_paths
      - "remote-schemas/**"
      - "vox-*/src/main/assets/schemas/**"
      - "scripts/validate_schemas.py"
      - "scripts/check_schema_parity.py"
  pull_request:
    paths: *schema_paths
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/validate_schemas.py remote-schemas
      # The published copy replaces the shipped one wherever a fetch has succeeded, so a term added
      # to an app's asset alone reaches no real device. Nothing else notices that.
      - run: python3 scripts/check_schema_parity.py
