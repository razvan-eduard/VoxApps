name: Build Vox Vision Release APK

on:
  push:
    tags:
      - 'vision-v*'
    branches:
      - main
    paths:
      - 'vox-vision/build.gradle.kts'
  # A dispatched run builds but does not publish, unless you tick this. Six accidental dispatches
  # once published six GitHub Releases, which is why publishing was blocked here at all — but a
  # blanket block also removes the only way to re-publish a release whose build succeeded and whose
  # publish step failed. An explicit opt-in keeps the accident impossible and the deliberate case
  # available.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release (move the tag, upload the APK). Off = build only.'
        type: boolean
        default: false
      dlc_mode:
        description: 'Override the DLC mode for this run (blank = whatever gradle.properties says).'
        type: choice
        options: ['', 'minimal', 'full']
        default: ''

# One release at a time per app. Two pushes landing close together would both force-move the same
# tag and both delete the same release before recreating it — whichever finished second would win,
# and which one that was would depend on runner scheduling. Queued rather than cancelled: a publish
# interrupted half way leaves a tag pointing at a release that no longer exists.
concurrency:
  group: release-vision
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Shallow on purpose — see release-commander.yml for why depth 1. actions/checkout
          # forwards fetch-depth to submodule clones too, so this also shrinks the
          # opencv/paddleocr/makeacopy submodule downloads, not just the main repo.
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-licenses: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine version tag
        id: version
        uses: ./.github/actions/compute-release-tag
        with:
          app-prefix: vision

      - name: Detect versionCode bump (skip build if this version was already released)
        id: check_bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Checks whether a GitHub Release already exists for this exact version, instead of
          # diffing versionCode against git's HEAD~1 — the old approach silently broke whenever
          # a push landed more than one commit at once (HEAD~1 then lands *inside* the same
          # push, already showing the bumped value, so prev==curr and the build gets skipped
          # even though this version has never been released).
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "$TAG already released — skipping build"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG not yet released — building"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run unit tests (if any)
        if: steps.check_bump.outputs.changed != 'false'
        run: ./gradlew :vox-vision:testDebugUnitTest --no-daemon || echo "No tests found"

      - name: Decode signing keystore
        if: steps.check_bump.outputs.changed != 'false'
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      # The mode is declared once, in gradle.properties, and read here. It used to be declared here
      # too, because Gradle and a shell packaging script each needed it and a mismatch shipped an APK
      # missing libraries nothing would fetch. That script is gone — Gradle packages both modes now —
      # so the only thing this workflow still needs the mode for is deciding whether to attach the
      # .so release assets. Needing to know it is not a reason to declare it again.
      - name: Resolve DLC mode
        id: dlc
        run: |
          MODE="${{ github.event.inputs.dlc_mode }}"
          if [ -z "$MODE" ]; then
            MODE=$(grep -E '^voxDlc=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          fi
          case "$MODE" in
            minimal|full) ;;
            *) echo "::error::voxDlc must be 'minimal' or 'full', got '$MODE'"; exit 1 ;;
          esac
          echo "Building in '$MODE' mode"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Build release APK and AAB
        if: steps.check_bump.outputs.changed != 'false'
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew :vox-vision:assembleRelease -PvoxDlc=${{ steps.dlc.outputs.mode }} --no-daemon
          ./gradlew :vox-vision:bundleRelease -PvoxDlc=${{ steps.dlc.outputs.mode }} --no-daemon

      - name: Rename APK and AAB with tag
        if: steps.check_bump.outputs.changed != 'false'
        run: |
          cp vox-vision/build/outputs/apk/release/vox-vision-release.apk \
             VoxVision-${{ steps.version.outputs.tag }}.apk
          cp vox-vision/build/outputs/bundle/release/vox-vision-release.aab \
             VoxVision-${{ steps.version.outputs.tag }}.aab

      - name: Deepen checkout for changelog
        if: steps.check_bump.outputs.changed != 'false'
        run: git fetch --prune --unshallow --tags origin

      - name: Generate CHANGELOG.md
        if: steps.check_bump.outputs.changed != 'false'
        id: changelog
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PREV_TAG=$(git tag -l "vision-v*" --sort=-v:refname | grep -v "$TAG" | head -n 1 || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "# VoxVision ${TAG}"
            echo ""
            echo "## Changes"
            echo ""
            # Scoped to this app's own directory, and restricted to user-facing commit
            # types (feat/fix/perf) — otherwise the changelog lists every other app's
            # (and docs/chore/ci) commits too.
            git log ${RANGE} --pretty=format:"- %s (%h)" --no-merges -- vox-vision/ \
              | grep -iE '^- (feat|fix|perf)(\(|!?:)' || echo "- Maintenance update"
            echo ""
            echo ""
            echo "## Full Changelog"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
            else
              echo "https://github.com/${{ github.repository }}/commits/${TAG}"
            fi
          } > CHANGELOG.md

      # Only in `full`. In `minimal` these libraries are inside the APK, and publishing them as
      # assets as well just adds ~43MB to the release that nothing will ever download.
      - name: Collect native libraries for DLC
        if: steps.check_bump.outputs.changed != 'false' && steps.dlc.outputs.mode == 'full'
        run: |
          mkdir -p dlc-libs
          # Copied straight from vox-vision/src/main/jniLibs/arm64-v8a — the location
          # scripts/build_opencv_android.sh writes to directly (see its VISION_JNI_DIR comment) —
          # rather than out of AGP's build/intermediates, which in `full` never contains them: they
          # are excluded before the native-lib merge runs. Being source-set files rather than
          # dependency artifacts, they are on disk regardless of how the APK was packaged, which is
          # why Vision needs no equivalent of Commander's collectDlcLibs task.
          cp vox-vision/src/main/jniLibs/arm64-v8a/*.so dlc-libs/
          ls -lh dlc-libs/

      # Publishing is for a push, not for a dispatch. `check_bump` only runs on a push to main, so
      # its output is empty on a manual run — and an empty value is not 'false', which meant every
      # "just build it and see" dispatch tagged the commit and cut a release at whatever version
      # happened to be current, walking straight around the guard that exists to prevent exactly
      # that. Building and testing still run: that is what a dispatch is for.
      - name: Point the tag at this commit
        if: steps.check_bump.outputs.changed != 'false' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # GITHUB_TOKEN can never hold the `workflows` scope, and what that forbids is making a ref
          # point at a tree whose .github/workflows content differs from the repository's own. It
          # bites when a workflow edit lands while a release is building: the tag then moves to a
          # commit whose workflow files are already stale. Going through the git/refs API was tried
          # and is subject to the same rule — it only trades an error naming the offending file for
          # a bare 403, so this is a push again. Tag the tip and nothing is stale.
          git tag -f "$TAG"
          git push origin "$TAG" --force

      - name: Delete existing release for a fresh publish date
        if: steps.check_bump.outputs.changed != 'false' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release delete "$TAG" --yes || true

      - name: Create GitHub Release
        if: steps.check_bump.outputs.changed != 'false' && (github.event_name != 'workflow_dispatch' || inputs.publish)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            VoxVision-*.apk
            VoxVision-*.aab
            CHANGELOG.md
            ${{ steps.dlc.outputs.mode == 'full' && 'dlc-libs/*.so' || '' }}
          body_path: CHANGELOG.md
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
