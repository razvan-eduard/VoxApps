name: Build Vox Vision Release APK

on:
  push:
    tags:
      - 'vision-v*'
    branches:
      - main
    paths:
      - 'vox-vision/build.gradle.kts'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-licenses: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Detect versionCode bump (skip build if unchanged)
        id: check_bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          PREV_CODE=$(git show HEAD~1:vox-vision/build.gradle.kts 2>/dev/null | grep 'versionCode' | grep -oE '[0-9]+' || echo "0")
          CURR_CODE=$(grep 'versionCode' vox-vision/build.gradle.kts | grep -oE '[0-9]+')
          echo "prev=$PREV_CODE curr=$CURR_CODE"
          if [ "$PREV_CODE" = "$CURR_CODE" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Run unit tests (if any)
        if: steps.check_bump.outputs.changed != 'false'
        run: ./gradlew :vox-vision:testDebugUnitTest --no-daemon || echo "No tests found"

      - name: Decode signing keystore
        if: steps.check_bump.outputs.changed != 'false'
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        if: steps.check_bump.outputs.changed != 'false'
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: ./gradlew :vox-vision:assembleRelease --no-daemon

      - name: Determine version tag
        if: steps.check_bump.outputs.changed != 'false'
        id: version
        uses: ./.github/actions/compute-release-tag
        with:
          app-prefix: vision

      - name: Rename APK with tag
        if: steps.check_bump.outputs.changed != 'false'
        run: |
          cp vox-vision/build/outputs/apk/release/vox-vision-release.apk \
             VoxVision-${{ steps.version.outputs.tag }}.apk

      - name: Collect native libraries for DLC
        if: steps.check_bump.outputs.changed != 'false'
        run: |
          mkdir -p dlc-libs
          # Copied straight from vox-vision/src/main/jniLibs/arm64-v8a — the location
          # scripts/build_opencv_android.sh writes to directly (see its VISION_JNI_DIR comment) —
          # rather than searched for in AGP's build/intermediates or the packaged APK. AGP 9.x does
          # not reliably propagate arm64-v8a native libs through its own merge/packaging pipeline for
          # this module (same class of issue as vox-commander's DLC excludes, confirmed via extensive
          # local testing), so intermediates may not actually contain them even though the final
          # release APK correctly excludes them either way.
          cp vox-vision/src/main/jniLibs/arm64-v8a/*.so dlc-libs/
          ls -lh dlc-libs/

      - name: Create GitHub Release
        if: steps.check_bump.outputs.changed != 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            VoxVision-*.apk
            dlc-libs/*.so
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
