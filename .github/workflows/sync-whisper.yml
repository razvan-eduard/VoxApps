name: Sync whisper.cpp Fork

# vox-commander/src/main/cpp/whisper.cpp is vendored unmodified (no local patch, unlike
# core/wakeword). This only checks for a new upstream stable tag, compiles it (to prove it still
# builds against our CMake/OpenCL setup) and opens a PR bumping the submodule pin — it deliberately
# does NOT call scripts/publish_whisper_libs.sh (that step publishes the compiled .so files as the
# production DLC release real users download, and must stay a manual, reviewed action after the PR
# is merged and someone has sanity-checked actual transcription quality on a device — CI can only
# verify "it compiles", never "it still transcribes correctly").

on:
  schedule:
    - cron: '0 9 2 * *' # monthly, 2nd 09:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-propose a target that was previously declined'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

# A native build that hangs must not be lapped by the next run — both would push the same
# branch. Queued rather than cancelled: these push branches and open PRs, so killing one
# mid-flight leaves more mess than letting it finish.
concurrency:
  group: sync-whisper
  cancel-in-progress: false

jobs:
  check-and-open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          # Persisted for the branch push, so it is pushed by whoever opens the PR below.
          token: ${{ secrets.README_PUSH_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      # Detection lives in scripts/check_whisper_version.sh — the same script a person runs, answering in
      # --report mode with the keys used below. This step used to be that script's logic
      # copied into YAML: four of the six pairs happened to agree, and the ones that did not
      # drifted silently (NewPipe's multi-line version, PaddleOCR's staleness floor).
      - name: Determine current pin and latest upstream version
        id: versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/vox check whisper --report >> "$GITHUB_OUTPUT"

      - name: Check whether this target was already proposed
        if: steps.versions.outputs.has_update == 'true'
        id: dedup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/sync-whisper-${{ steps.versions.outputs.latest_tag }}"
          EXISTING=$(gh pr list --head "$BRANCH" --state all --json number,state -q '.[0] | select(.) | "\(.number) \(.state)"' || true)
          if [ -n "$EXISTING" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "PR $EXISTING already exists for $BRANCH — re-proposing it (force)"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$EXISTING" ]; then
            echo "PR $EXISTING already exists for $BRANCH — nothing to do"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.versions.outputs.has_update == 'true' && steps.dedup.outputs.proceed == 'true'
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        if: steps.versions.outputs.has_update == 'true' && steps.dedup.outputs.proceed == 'true'
        uses: android-actions/setup-android@v4
        with:
          accept-android-licenses: true

      - name: Install NDK and CMake
        if: steps.versions.outputs.has_update == 'true' && steps.dedup.outputs.proceed == 'true'
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # From gradle/libs.versions.toml, so this cannot drift from what the scripts resolve.
          NDK_VERSION=$(grep -m1 '^ndk = ' gradle/libs.versions.toml | sed 's/.*"\(.*\)".*/\1/')
          sdkmanager --install "ndk;${NDK_VERSION}" "cmake;3.22.1"


      - name: Check out the OpenCL build inputs
        run: |
          # The OpenCL headers are a pinned submodule (the import library is an in-repo dlopen
          # shim); kernel
          # embedding needs only python3, which the runner already has.
          git submodule update --init vendor/OpenCL-Headers

      - name: Bump submodule to latest tag
        if: steps.versions.outputs.has_update == 'true' && steps.dedup.outputs.proceed == 'true'
        id: bump
        run: |
          LATEST_TAG="${{ steps.versions.outputs.latest_tag }}"
          BRANCH="chore/sync-whisper-$LATEST_TAG"
          git checkout -b "$BRANCH"
          cd vox-commander/src/main/cpp/whisper.cpp
          git checkout "$LATEST_TAG"
          cd -
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Grant execute permission for gradlew
        if: steps.versions.outputs.has_update == 'true' && steps.dedup.outputs.proceed == 'true'
        run: chmod +x gradlew

      - name: Compile (proves it still builds against our CMake/OpenCL setup)
        if: steps.versions.outputs.has_update == 'true' && steps.dedup.outputs.proceed == 'true'
        run: ./gradlew :vox-commander:assembleDebug --no-daemon

      - name: Run unit tests
        if: steps.versions.outputs.has_update == 'true' && steps.dedup.outputs.proceed == 'true'
        run: ./gradlew :vox-commander:testDebugUnitTest --no-daemon

      - name: Commit submodule bump
        if: steps.versions.outputs.has_update == 'true' && steps.dedup.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vox-commander/src/main/cpp/whisper.cpp
          git commit -m "chore: bump whisper.cpp submodule to ${{ steps.versions.outputs.latest_tag }}"
          git push origin "${{ steps.bump.outputs.branch }}"

      - name: Open PR
        if: steps.versions.outputs.has_update == 'true' && steps.dedup.outputs.proceed == 'true'
        env:
          # A PAT, not GITHUB_TOKEN. GitHub never triggers a workflow from an event caused by
          # GITHUB_TOKEN — the rule that stops a workflow opening a PR that starts a workflow that
          # opens a PR. The cost is that a PR opened that way has its required checks *absent*
          # rather than pending, and a merge is blocked on absent exactly as it is on failing, so
          # the PR can never become mergeable. Opening it as an account makes CI run on it.
          GH_TOKEN: ${{ secrets.README_PUSH_TOKEN }}
        run: |
          gh pr create \
            --title "chore: whisper.cpp upstream ${{ steps.versions.outputs.latest_tag }} available" \
            --body "Upstream [ggerganov/whisper.cpp](https://github.com/ggerganov/whisper.cpp) tagged \`${{ steps.versions.outputs.latest_tag }}\` (we're pinned at \`${{ steps.versions.outputs.current_tag || steps.versions.outputs.current_sha }}\`).

          This PR bumps the submodule pin and confirms the new version **compiles** (CMake/OpenCL build succeeded) and unit tests pass. It does **not** publish anything.

          Before merging, please:
          1. Install the debug build on a device and sanity-check actual transcription quality/latency — a successful compile says nothing about STT accuracy.
          2. Only after merging, run \`./scripts/vox release publish-libs\` yourself to publish the new \`.so\` libs as the production DLC release (this workflow deliberately never does that automatically)." \
            --base main \
            --head "${{ steps.bump.outputs.branch }}"
