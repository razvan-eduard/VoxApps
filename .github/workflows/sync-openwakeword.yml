name: Sync OpenWakeword Fork

# core/wakeword vendors + locally patches xyz.rementia/openwakeword-android-kt (see
# core/wakeword/NOTICE). Local patches are maintained as real, storable diffs under
# core/wakeword/patches/ — one per patched file (0001-rms-silence-gate.patch for
# AudioRecorder.kt, 0002-wakeword-engine-params.patch for WakeWordEngine.kt — regenerate both
# with scripts/regen_openwakeword_patch.sh whenever either patch itself changes).
#
# When a new upstream tag appears, this workflow: bumps the pristine vendor/openwakeword-android-kt
# submodule, re-vendors ALL sources into core/wakeword, and tries to `git apply` every stored patch.
#   - If all apply cleanly AND the module still compiles + tests pass -> opens a PR that's already
#     ready to review/approve (the common case — nothing for a human to hand-merge).
#   - If any patch conflicts (upstream changed the exact patched region) -> opens a PR with the
#     conflicting hunk(s) attached, clearly marked as needing a manual merge — the other patch(es)
#     still apply independently, so only the conflicting file needs hand-merging.
#   - If all apply but something else broke -> opens a PR with the build/test failure attached.
# Never auto-merges — always a PR for review.

on:
  schedule:
    - cron: '0 6 * * 3' # weekly, Wednesday 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-propose a target that was previously declined'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

# A native build that hangs must not be lapped by the next run — both would push the same
# branch. Queued rather than cancelled: these push branches and open PRs, so killing one
# mid-flight leaves more mess than letting it finish.
concurrency:
  group: sync-openwakeword
  cancel-in-progress: false

jobs:
  check-and-open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      # Detection lives in scripts/check_openwakeword_version.sh — the same script a person runs, answering in
      # --report mode with the keys used below. This step used to be that script's logic
      # copied into YAML: four of the six pairs happened to agree, and the ones that did not
      # drifted silently (NewPipe's multi-line version, PaddleOCR's staleness floor).
      - name: Determine current pin and latest upstream version
        id: versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/vox check openwakeword --report >> "$GITHUB_OUTPUT"

      - name: Check whether this target was already proposed
        if: steps.versions.outputs.has_update == 'true'
        id: dedup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/sync-openwakeword-${{ steps.versions.outputs.latest_tag }}"
          EXISTING=$(gh pr list --head "$BRANCH" --state all --json number,state -q '.[0] | select(.) | "\(.number) \(.state)"' || true)
          if [ -n "$EXISTING" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "PR $EXISTING already exists for $BRANCH — re-proposing it (force)"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$EXISTING" ]; then
            echo "PR $EXISTING already exists for $BRANCH — nothing to do"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump submodule + re-vendor sources
        if: steps.versions.outputs.has_update == 'true' && steps.dedup.outputs.proceed == 'true'
        id: bump
        run: |
          LATEST_TAG="${{ steps.versions.outputs.latest_tag }}"
          BRANCH="chore/sync-openwakeword-$LATEST_TAG"
          git checkout -b "$BRANCH"

          cd vendor/openwakeword-android-kt
          git fetch --tags --quiet
          git checkout "$LATEST_TAG"
          cd "$GITHUB_WORKSPACE"

          # Full re-vendor: mirror every upstream source file into core/wakeword. For files other
          # than AudioRecorder.kt this is a pure refresh; AudioRecorder.kt is overwritten with the
          # pristine upstream version here and patched in the next step.
          rm -rf core/wakeword/src/main/kotlin/com/rementia
          mkdir -p core/wakeword/src/main/kotlin/com/rementia
          cp -r vendor/openwakeword-android-kt/wakeword/src/main/kotlin/com/rementia/* \
                core/wakeword/src/main/kotlin/com/rementia/

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Apply local patches
        if: steps.versions.outputs.has_update == 'true' && steps.dedup.outputs.proceed == 'true'
        id: apply
        run: |
          # Three-way, so an upstream release that moves lines near an adaptation merges instead of
          # refusing. A refusal here is silent damage: the re-vendored file stays pristine and the
          # adaptation is simply gone. A real collision arrives as conflict markers, which a person
          # can resolve in the PR.
          source scripts/lib/patches.sh
          STATUS="clean"
          for PATCH_FILE in core/wakeword/patches/*.patch; do
            NAME="$(basename "$PATCH_FILE")"
            # The merge base for each hunk is the pristine upstream file the patch was cut against.
            PRISTINE=()
            while read -r rel; do
              PRISTINE+=("vendor/openwakeword-android-kt/wakeword/${rel#core/wakeword/}")
            done < <(git apply --numstat "$PATCH_FILE" | awk '{print $3}')

            case "$(vox_patch_apply_3way "$PATCH_FILE" "${PRISTINE[@]}")" in
              clean)    echo "✅ $NAME applied" ;;
              conflict) echo "⚠️ $NAME applied with conflicts in:"
                        vox_patch_conflicts | sed 's/^/     /'
                        STATUS="conflict" ;;
              *)        echo "❌ $NAME could not be applied at all"
                        STATUS="conflict" ;;
            esac
          done
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.versions.outputs.has_update == 'true' && steps.dedup.outputs.proceed == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        if: steps.versions.outputs.has_update == 'true' && steps.dedup.outputs.proceed == 'true'
        uses: android-actions/setup-android@v4
        with:
          accept-android-licenses: true

      - name: Grant execute permission for gradlew
        if: steps.versions.outputs.has_update == 'true' && steps.dedup.outputs.proceed == 'true'
        run: chmod +x gradlew

      # Only run the build when the patch applied cleanly — a conflict already means "needs manual
      # merge", so there's nothing meaningful to compile yet. compileDebugKotlin/testDebugUnitTest
      # (not assembleDebug) deliberately skip the unrelated whisper.cpp native build and Vosk/OWW
      # version-check tasks wired into preBuild — this workflow only needs to prove the OpenWakeWord
      # module and its consumer still compile and pass unit tests.
      - name: Compile + test (only if the patch applied cleanly)
        if: steps.versions.outputs.has_update == 'true' && steps.dedup.outputs.proceed == 'true' && steps.apply.outputs.status == 'clean'
        id: build
        run: |
          if ./gradlew :core:wakeword:compileDebugKotlin \
                       :vox-commander:compileDebugKotlin \
                       :vox-commander:testDebugUnitTest \
                       -PvoxSkipNativePrep \
                       --no-daemon > /tmp/build.log 2>&1; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
            tail -c 20000 /tmp/build.log
          fi

      - name: Commit re-vendor + submodule bump
        if: steps.versions.outputs.has_update == 'true' && steps.dedup.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vendor/openwakeword-android-kt core/wakeword/src/main/kotlin
          git commit -m "chore: sync OpenWakeWord fork to ${{ steps.versions.outputs.latest_tag }}"
          git push origin "${{ steps.bump.outputs.branch }}"

      - name: Prepare PR body
        if: steps.versions.outputs.has_update == 'true' && steps.dedup.outputs.proceed == 'true'
        run: |
          APPLY_STATUS="${{ steps.apply.outputs.status }}"
          BUILD_STATUS="${{ steps.build.outputs.status }}"

          {
            echo "Upstream [Re-MENTIA/openwakeword-android-kt](https://github.com/Re-MENTIA/openwakeword-android-kt) released \`${{ steps.versions.outputs.latest_tag }}\` (we were pinned at \`${{ steps.versions.outputs.current_tag || steps.versions.outputs.current_sha }}\`)."
            echo ""
            if [ "$APPLY_STATUS" == "clean" ] && [ "$BUILD_STATUS" == "pass" ]; then
              echo "**✅ All local patches applied automatically. Compiles and unit tests pass.** All sources are re-vendored and every patch under core/wakeword/patches/ is already re-applied — nothing left to hand-merge. Please review the diff and approve."
            elif [ "$APPLY_STATUS" == "clean" ] && [ "$BUILD_STATUS" == "fail" ]; then
              echo "**⚠️ Patches applied textually, but the build/tests failed** — something else in this release broke compatibility. Log tail:"
              echo '```'
              tail -c 8000 /tmp/build.log 2>/dev/null || echo "(log unavailable)"
              echo '```'
            else
              echo "**⚠️ Manual merge needed** — one or more local patches no longer apply cleanly (upstream changed the same lines). All other files/patches are already re-vendored/re-applied independently. Reject details:"
              echo '```'
              for f in /tmp/apply-reject-*.txt; do
                [ -s "$f" ] && { echo "--- $(basename "$f")"; cat "$f"; }
              done
              echo '```'
              echo ""
              echo "After resolving, regenerate the patch file(s) with \`./scripts/vox patches regen wakeword\`."
            fi
          } > /tmp/pr-body.md

      - name: Open PR
        if: steps.versions.outputs.has_update == 'true' && steps.dedup.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APPLY_STATUS="${{ steps.apply.outputs.status }}"
          BUILD_STATUS="${{ steps.build.outputs.status }}"
          if [ "$APPLY_STATUS" == "clean" ] && [ "$BUILD_STATUS" == "pass" ]; then
            TITLE="chore: OpenWakeWord ${{ steps.versions.outputs.latest_tag }} — ready to review"
          elif [ "$APPLY_STATUS" == "clean" ]; then
            TITLE="chore: OpenWakeWord ${{ steps.versions.outputs.latest_tag }} — applied but build failed"
          else
            TITLE="chore: OpenWakeWord ${{ steps.versions.outputs.latest_tag }} — manual merge needed"
          fi

          gh pr create \
            --title "$TITLE" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "${{ steps.bump.outputs.branch }}"
