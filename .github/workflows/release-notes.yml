name: Build Vox Notes Release APK

on:
  push:
    tags:
      - 'notes-v*'
    branches:
      - main
    paths:
      - 'vox-notes/build.gradle.kts'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-licenses: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Detect versionCode bump (skip build if unchanged)
        id: check_bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          PREV_CODE=$(git show HEAD~1:vox-notes/build.gradle.kts 2>/dev/null | grep 'versionCode' | grep -oE '[0-9]+' || echo "0")
          CURR_CODE=$(grep 'versionCode' vox-notes/build.gradle.kts | grep -oE '[0-9]+')
          echo "prev=$PREV_CODE curr=$CURR_CODE"
          if [ "$PREV_CODE" = "$CURR_CODE" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Run unit tests
        if: steps.check_bump.outputs.changed != 'false'
        run: ./gradlew :vox-notes:testDebugUnitTest --no-daemon

      - name: Decode signing keystore
        if: steps.check_bump.outputs.changed != 'false'
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK and AAB
        if: steps.check_bump.outputs.changed != 'false'
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew :vox-notes:assembleRelease --no-daemon
          ./gradlew :vox-notes:bundleRelease --no-daemon

      - name: Determine version tag
        if: steps.check_bump.outputs.changed != 'false'
        id: version
        uses: ./.github/actions/compute-release-tag
        with:
          app-prefix: notes

      - name: Rename APK and AAB with tag
        if: steps.check_bump.outputs.changed != 'false'
        run: |
          cp vox-notes/build/outputs/apk/release/vox-notes-release.apk \
             VoxNotes-${{ steps.version.outputs.tag }}.apk
          cp vox-notes/build/outputs/bundle/release/vox-notes-release.aab \
             VoxNotes-${{ steps.version.outputs.tag }}.aab

      - name: Generate CHANGELOG.md
        if: steps.check_bump.outputs.changed != 'false'
        id: changelog
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PREV_TAG=$(git tag -l "notes-v*" --sort=-v:refname | grep -v "$TAG" | head -n 1 || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "# VoxNotes ${TAG}"
            echo ""
            echo "## Changes"
            echo ""
            # Scoped to this app's own directory, and restricted to user-facing commit
            # types (feat/fix/perf) — otherwise the changelog lists every other app's
            # (and docs/chore/ci) commits too.
            git log ${RANGE} --pretty=format:"- %s (%h)" --no-merges -- vox-notes/ \
              | grep -iE '^- (feat|fix|perf)(\(|!?:)' || echo "- Maintenance update"
            echo ""
            echo ""
            echo "## Full Changelog"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
            else
              echo "https://github.com/${{ github.repository }}/commits/${TAG}"
            fi
          } > CHANGELOG.md

      - name: Force update tag to current commit
        if: steps.check_bump.outputs.changed != 'false'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push origin "$TAG" --force

      - name: Delete existing release for a fresh publish date
        if: steps.check_bump.outputs.changed != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release delete "$TAG" --yes || true

      - name: Create GitHub Release
        if: steps.check_bump.outputs.changed != 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            VoxNotes-*.apk
            VoxNotes-*.aab
            CHANGELOG.md
          body_path: CHANGELOG.md
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
