[versions]
agp = "9.2.1"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.8.0"
kotlin = "2.4.0"
composeBom = "2026.02.01"
room = "2.8.4"
retrofit = "3.0.0"
okhttp = "5.4.0"
ksp = "2.2.10-2.0.2"
mockk = "1.14.11"
